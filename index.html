      html += '<div style="font-size:15px;color:#e5e7eb;font-family:\'Barlow Condensed\',sans-serif;font-weight:800">'+gpOddsM(gl.awayOdds)+'</div></div>';
      html += '<div><div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px">Book</div>';
      html += '<div style="font-size:11px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;text-transform:capitalize">'+(gl.provider||'—')+'</div></div>';
      html += '<div><div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px">'+homeAbbrev+' line</div>';
      html += '<div style="font-size:15px;color:#e5e7eb;font-family:\'Barlow Condensed\',sans-serif;font-weight:800">'+gpOddsM(gl.homeOdds)+'</div></div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // ── Series Implications ──────────────────────────────────────────────────
  function implPanelM(teamAbbrev, teamName, owner, ci, allOdds, winOdds, loseOdds) {
    if (!allOdds || allOdds.cup == null) return '';
    var cupSwing = (winOdds.cup||0) - (loseOdds.cup||0);
    var r3Swing  = (winOdds.r3 ||0) - (loseOdds.r3 ||0);
    if (cupSwing < 0.02 && r3Swing < 0.02) return '';
    var s = '<div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 16px;margin-bottom:12px">';
    s += '<div style="font-size:10px;color:#f59e0b;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px">SERIES IMPLICATIONS</div>';
    s += '<div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">';
    s += logoUrl(teamAbbrev, 26);
    s += '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:900;color:#f9fafb">'+teamName+'</span>';
    if (owner) s += pillM(owner, ci);
    s += '</div>';
    var tiles = [
      {label:'Make CF',  w:winOdds.r3,  l:loseOdds.r3,  a:allOdds.r3},
      {label:'Make SCF', w:winOdds.r4,  l:loseOdds.r4,  a:allOdds.r4},
      {label:'Win Cup',  w:winOdds.cup, l:loseOdds.cup, a:allOdds.cup}
    ].filter(function(t){ return (t.a||0) >= 0.001 || (t.w||0) >= 0.001; });
    s += '<div style="display:grid;grid-template-columns:repeat('+tiles.length+',1fr);gap:6px">';
    tiles.forEach(function(t) {
      s += '<div style="background:rgba(0,0,0,0.25);border-radius:10px;padding:10px 8px;text-align:center">';
      s += '<div style="font-size:9px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px">'+t.label+'</div>';
      s += '<div style="font-size:19px;color:#22c55e;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;line-height:1">'+gpFmtM(t.w)+'</div>';
      s += '<div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;margin-bottom:8px">if win</div>';
      s += '<div style="height:1px;background:rgba(255,255,255,0.06);margin-bottom:8px"></div>';
      s += '<div style="font-size:19px;color:#f87171;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;line-height:1">'+gpFmtM(t.l)+'</div>';
      s += '<div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif">if lose</div>';
      s += '</div>';
    });
    s += '</div></div>';
    return s;
  }
  html += implPanelM(awayAbbrev, awayName, awayOwner, awayCI, awayAll, awayWin, awayLose);
  html += implPanelM(homeAbbrev, homeName, homeOwner, homeCI, homeAll, homeWin, homeLose);

  // ── Goaltending ──────────────────────────────────────────────────────────
  if ((data.awayGoalies && data.awayGoalies.length) || (data.homeGoalies && data.homeGoalies.length)) {
    html += '<div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 16px;margin-bottom:12px">';
    html += '<div style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px">Goaltending</div>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
    function goalieColM(goalies, totals, abbrev) {
      var starter = (goalies||[])[0], backup = (goalies||[])[1];
      var s = '<div style="background:rgba(0,0,0,0.2);border-radius:10px;padding:10px">';
      s += '<div style="display:flex;align-items:center;gap:5px;margin-bottom:10px">';
      s += logo(abbrev, 18);
      var tr = (totals||{}).record||'';
      if (tr) s += '<span style="font-size:11px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif">'+tr+' team</span>';
      s += '</div>';
      if (starter) {
        s += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
        if (starter.headshot) s += '<img src="'+starter.headshot+'" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1)" onerror="this.style.display=\'none\'">';
        s += '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:800;color:#f9fafb;line-height:1.1">'+starter.name+'</div>';
        s += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;color:#22c55e;font-weight:700;margin-top:1px">'+(starter.record||'')+'</div></div></div>';
        s += '<div style="display:flex;gap:8px">';
        s += '<div style="flex:1;background:rgba(255,255,255,0.05);border-radius:6px;padding:5px 6px;text-align:center">';
        s += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:800;color:#e5e7eb">'+(starter.gaa||0).toFixed(2)+'</div>';
        s += '<div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px">GAA</div></div>';
        s += '<div style="flex:1;background:rgba(255,255,255,0.05);border-radius:6px;padding:5px 6px;text-align:center">';
        s += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;font-weight:800;color:#e5e7eb">.'+Math.round((starter.savePctg||0)*1000)+'</div>';
        s += '<div style="font-size:9px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px">SV%</div></div></div>';
      }
      if (backup && backup.gamesPlayed > 0) {
        s += '<div style="display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)">';
        if (backup.headshot) s += '<img src="'+backup.headshot+'" style="width:26px;height:26px;border-radius:50%;object-fit:cover;opacity:0.7" onerror="this.style.display=\'none\'">';
        s += '<div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:12px;color:#6b7280">'+backup.name+'</div>';
        s += '<div style="font-size:10px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif">'+(backup.record||'')+' · '+(backup.gaa||0).toFixed(2)+' · .'+Math.round((backup.savePctg||0)*1000)+'</div></div></div>';
      }
      s += '</div>';
      return s;
    }
    html += goalieColM(data.awayGoalies, data.awayGoalieTeamTotals, awayAbbrev);
    html += goalieColM(data.homeGoalies, data.homeGoalieTeamTotals, homeAbbrev);
    html += '</div></div>';
  }

  // ── Players to Watch ─────────────────────────────────────────────────────
  if (data.skaterLeaders && data.skaterLeaders.length) {
    html += '<div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:14px 16px;margin-bottom:12px">';
    html += '<div style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px">Players to Watch</div>';
    data.skaterLeaders.forEach(function(cat) {
      html += '<div style="display:grid;grid-template-columns:1fr auto 56px auto 1fr;align-items:center;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.05)">';
      // Away: headshot + name
      html += '<div style="display:flex;align-items:center;gap:7px;overflow:hidden">';
      if (cat.away.headshot) html += '<img src="'+cat.away.headshot+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.style.display=\'none\'">';
      html += '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:800;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+cat.away.name+'</span>';
      html += '</div>';
      // Away stat
      html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:24px;font-weight:900;color:#3b82f6;line-height:1;text-align:right">'+cat.away.value+'</div>';
      // Category
      html += '<div style="text-align:center;font-size:8px;color:#374151;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.6px;text-transform:uppercase;line-height:1.3">'+cat.category+'</div>';
      // Home stat
      html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:24px;font-weight:900;color:#3b82f6;line-height:1;text-align:left">'+cat.home.value+'</div>';
      // Home: name + headshot
      html += '<div style="display:flex;align-items:center;gap:7px;flex-direction:row-reverse;overflow:hidden">';
      if (cat.home.headshot) html += '<img src="'+cat.home.headshot+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.style.display=\'none\'">';
      html += '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:800;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;direction:rtl">'+cat.home.name+'</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<div id="lgo-physicals-container"></div>';
  html += '</div>';
  overlay.innerHTML = html;
}

// ── Bracket View ──────────────────────────────────────────────────────────
function getSeriesLeader(sr) {
  if (!sr || !sr.topTeam || sr.topTeam === 'TBD') return 'TBD';
  if (sr.topWins === 4) return sr.topTeam;
  if (sr.bottomWins === 4) return sr.bottomTeam;
  return sr.topTeam + '/' + sr.bottomTeam;
}
function predictedMatchup(s1, s2) {
  var t1 = getSeriesLeader(s1), t2 = getSeriesLeader(s2);
  if (t1 === 'TBD' && t2 === 'TBD') return null;
  return {topTeam: t1, bottomTeam: t2, topWins: 0, bottomWins: 0, isPredicted: true};
}
function augmentPartialR2(series, s1, s2) {
  if (!series || series.isPredicted) return series;
  var topTBD = !series.topTeam || series.topTeam === 'TBD';
  var botTBD = !series.bottomTeam || series.bottomTeam === 'TBD';
  if (!topTBD && !botTBD) return series;
  var knownTeam = topTBD ? series.bottomTeam : series.topTeam;
  var s1has = s1 && (s1.topTeam === knownTeam || s1.bottomTeam === knownTeam);
  var otherSeries = s1has ? s2 : s1;
  var pred = getSeriesLeader(otherSeries);
  if (!pred || pred === 'TBD') return series;
  var out = Object.assign({}, series);
  if (topTBD) out.topTeam = pred; else out.bottomTeam = pred;
  return out;
}

function buildBracketCard(s, gamesData, isLarge, shareMode, isCompact) {
  if (s && s.isPredicted) {
    var pt1 = s.topTeam === 'TBD' ? '?' : s.topTeam;
    var pt2 = s.bottomTeam === 'TBD' ? '?' : s.bottomTeam;
    return '<div class="bc-card bc-tbd">'
      + '<div class="bc-team"><span class="bc-name" style="opacity:0.45">' + pt1 + '</span></div>'
      + '<div class="bc-team"><span class="bc-name" style="opacity:0.45">' + pt2 + '</span></div>'
      + '</div>';
  }
  if (!s || !s.topTeam || s.topTeam === 'TBD') {
    return '<div class="bc-card bc-tbd">'
      + '<div class="bc-team" style="justify-content:center"><span class="bc-name" style="color:var(--muted)">TBD</span></div>'
      + '<div class="bc-team" style="justify-content:center"><span class="bc-name" style="color:var(--muted)">TBD</span></div>'
      + '</div>';
  }
  var pool = getActivePool();
  var t1 = s.topTeam, t2 = s.bottomTeam;
  var w1 = s.topWins || 0, w2 = s.bottomWins || 0;
  var t1elim = w2 === 4, t2elim = w1 === 4;
  var t1lead = w1 > w2, t2lead = w2 > w1;
  var o1 = getTeamOwnerMaker(t1), o2 = getTeamOwnerMaker(t2);
  var c1 = o1 ? getPC(pool, o1.ci).color : null;
  var c2 = o2 ? getPC(pool, o2.ci).color : null;
  var live = gamesData && isSeriesLive(gamesData, t1, t2);
  var bg1 = c1 ? hexToRgba(c1, 0.2) : null;
  var bg2 = c2 ? hexToRgba(c2, 0.2) : null;
  var p1pill = o1 ? '<span class="bc-pill" style="background:' + bg1 + ';color:' + c1 + '">' + o1.abbrev + '</span>' : '';
  var p2pill = o2 ? '<span class="bc-pill" style="background:' + bg2 + ';color:' + c2 + '">' + o2.abbrev + '</span>' : '';
  // Compact (past round): just logo + pill, winner lit / loser faded
  if (isCompact) {
    var t1loser = w2 === 4, t2loser = w1 === 4;
    var t1win = w1 === 4, t2win = w2 === 4;
    var t1isPredC = t1 && t1.includes('/');
    var t2isPredC = t2 && t2.includes('/');
    var smScore = (!t1isPredC && !t2isPredC && (w1 > 0 || w2 > 0))
      ? '<div class="bc-sm-score">' + w1 + '–' + w2 + '</div>' : '';
    return '<div class="bc-card bc-card-sm' + (live ? ' bc-live' : '') + '">'
      + (t1isPredC
        ? '<div class="bc-team"><span class="bc-name" style="opacity:0.45;font-size:10px">' + t1 + '</span></div>'
        : '<div class="bc-team' + (t1loser ? ' bc-loser' : t1win ? ' bc-winner' : '') + '" style="border-left-color:' + (c1||'transparent') + '">'
          + '<img class="bc-logo" src="https://assets.nhle.com/logos/nhl/svg/' + t1 + '_'+logoSfx(t1)+'.svg" onerror="this.style.display=\'none\'">'
          + p1pill + '</div>')
      + (t2isPredC
        ? '<div class="bc-team"><span class="bc-name" style="opacity:0.45;font-size:10px">' + t2 + '</span></div>'
        : '<div class="bc-team' + (t2loser ? ' bc-loser' : t2win ? ' bc-winner' : '') + '" style="border-left-color:' + (c2||'transparent') + '">'
          + '<img class="bc-logo" src="https://assets.nhle.com/logos/nhl/svg/' + t2 + '_'+logoSfx(t2)+'.svg" onerror="this.style.display=\'none\'">'
          + p2pill + '</div>')
      + smScore
      + '</div>';
  }
  var gamesHtml = (!shareMode && gamesData) ? buildBracketGames(t1, t2, gamesData) : '';
  var clickAttr = (!shareMode && gamesHtml) ? ' onclick="toggleBracketCard(this)"' : '';
  var t1win = w1 === 4, t2win = w2 === 4;
  var t1isPred = t1 && t1.includes('/');
  var t2isTBD = !t2 || t2 === 'TBD';
  var t2isPred = t2 && t2.includes('/');
  var row1 = t1isPred
    ? '<div class="bc-team"><span class="bc-name" style="opacity:0.45">' + t1 + '</span></div>'
    : '<div class="bc-team' + (t1elim ? ' bc-elim' : t1win ? ' bc-winner' : '') + '" style="border-left-color:' + (c1 || 'transparent') + '">'
      + '<img class="bc-logo" src="https://assets.nhle.com/logos/nhl/svg/' + t1 + '_'+logoSfx(t1)+'.svg" onerror="this.style.display=\'none\'">'
      + '<span class="bc-name">' + t1 + '</span>'
      + p1pill
      + '<span class="bc-wins' + (t1lead ? ' bc-lead' : '') + '">' + w1 + '</span>'
      + '</div>';
  var row2 = t2isTBD
    ? '<div class="bc-team" style="justify-content:center"><span class="bc-name" style="color:var(--muted);font-weight:400">TBD</span></div>'
    : t2isPred
      ? '<div class="bc-team"><span class="bc-name" style="opacity:0.45">' + t2 + '</span></div>'
      : '<div class="bc-team' + (t2elim ? ' bc-elim' : t2win ? ' bc-winner' : '') + '" style="border-left-color:' + (c2 || 'transparent') + '">'
      + '<img class="bc-logo" src="https://assets.nhle.com/logos/nhl/svg/' + t2 + '_'+logoSfx(t2)+'.svg" onerror="this.style.display=\'none\'">'
      + '<span class="bc-name">' + t2 + '</span>'
      + p2pill
      + '<span class="bc-wins' + (t2lead ? ' bc-lead' : '') + '">' + w2 + '</span>'
      + '</div>';
  return '<div class="bc-card' + (live ? ' bc-live' : '') + (isLarge ? ' bc-card-lg' : '') + '"' + clickAttr + '>'
    + row1
    + row2
    + (gamesHtml ? '<div class="bc-games-wrap">' + gamesHtml + '</div>' : '')
    + '</div>';
}

function buildBracket(shareMode) {
  var st = _makerState;
  if (!st || !st.parsed) return '<div class="loading">Loading...</div>';
  var p = st.parsed;
  var r1w = p.r1w || [], r1e = p.r1e || [];
  var r2 = p.r2 || [null,null,null,null];
  var r3 = p.r3 || [null,null];
  var r4 = p.r4 || null;
  var gd = st.gamesData || [];
  function predBracket(s1, s2) {
    var s1done = s1 && (s1.topWins === 4 || s1.bottomWins === 4);
    var s2done = s2 && (s2.topWins === 4 || s2.bottomWins === 4);
    if (!s1done && !s2done) return null;
    return predictedMatchup(s1, s2);
  }
  var pr2 = [
    augmentPartialR2(r2[0] || predBracket(r1w[0], r1w[1]), r1w[0], r1w[1]),
    augmentPartialR2(r2[1] || predBracket(r1w[2], r1w[3]), r1w[2], r1w[3]),
    augmentPartialR2(r2[2] || predBracket(r1e[0], r1e[1]), r1e[0], r1e[1]),
    augmentPartialR2(r2[3] || predBracket(r1e[2], r1e[3]), r1e[2], r1e[3]),
  ];

  var ar = getActiveRound(p);
  // col widths: compact past cols (50px), active col (80px), default r2 (56px)
  var cw1 = ar === 1 ? '' : 'width:50px;flex:none';
  var cw2 = ar === 2 ? 'flex:1;width:auto' : (ar > 2 ? 'width:50px' : '');
  var cw3 = ar === 3 ? 'width:90px' : (ar > 3 ? 'width:50px' : '');
  var cw4 = ar === 4 ? 'width:72px' : '';
  function c(s, round) { return buildBracketCard(s, gd, ar===round, shareMode, round < ar); }
  function cl(s) { return buildBracketCard(s, gd, ar===1, shareMode, ar > 1 && window.innerWidth <= 640); }

  var shareBtn = shareMode ? '' : '<button onclick="showBracketShareOverlay()" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--muted);font-family:Inter,sans-serif;font-size:10px;padding:3px 8px;border-radius:8px;cursor:pointer">📸</button>';
  return '<div class="bracket-wrap">'
    + '<div class="bracket-conf-labels"><span class="bracket-conf-label">Western Conference</span>' + shareBtn + '<span class="bracket-conf-label">Eastern Conference</span></div>'

    // Top half: [R1-W + R2-W] | center gap | [R2-E + R1-E]
    + '<div class="bracket-half">'
    + '<div class="bc-half-group">'
    +   '<div class="bc-r1-col" style="' + cw1 + '">' + cl(r1w[0]) + cl(r1w[1]) + '</div>'
    +   '<div class="bc-r2-col" style="' + cw2 + '"><div class="bc-round-label">Rd 2</div>' + c(pr2[0], 2) + '</div>'
    + '</div>'
    + '<div class="bc-center-gap"></div>'
    + '<div class="bc-half-group" style="flex-direction:row-reverse">'
    +   '<div class="bc-r1-col" style="' + cw1 + '">' + cl(r1e[0]) + cl(r1e[1]) + '</div>'
    +   '<div class="bc-r2-col" style="' + cw2 + '"><div class="bc-round-label">Rd 2</div>' + c(pr2[2], 2) + '</div>'
    + '</div>'
    + '</div>'

    // Middle: CF-W | SCF | CF-E
    + '<div class="bracket-middle">'
    + '<div class="bc-cf-col"><div class="bc-round-label">Conf Finals</div>' + c(r3[0]) + '</div>'
    + '<div class="bc-scf-col" style="' + cw4 + '"><div class="bc-trophy"><img src="https://assets.nhle.com/logos/playoffs/png/scp-20252026-cup.png" alt="Stanley Cup Final"></div><div class="bc-scf-label">Stanley Cup<br>Final</div>' + c(r4, 4) + '</div>'
    + '<div class="bc-cf-col"><div class="bc-round-label">Conf Finals</div>' + c(r3[1]) + '</div>'
    + '</div>'

    // Bottom half: [R1-W + R2-W] | center gap | [R2-E + R1-E]
    + '<div class="bracket-half">'
    + '<div class="bc-half-group">'
    +   '<div class="bc-r1-col" style="' + cw1 + '">' + cl(r1w[2]) + cl(r1w[3]) + '</div>'
    +   '<div class="bc-r2-col" style="' + cw2 + '"><div class="bc-round-label">Rd 2</div>' + c(pr2[1], 2) + '</div>'
    + '</div>'
    + '<div class="bc-center-gap"></div>'
    + '<div class="bc-half-group" style="flex-direction:row-reverse">'
    +   '<div class="bc-r1-col" style="' + cw1 + '">' + cl(r1e[2]) + cl(r1e[3]) + '</div>'
    +   '<div class="bc-r2-col" style="' + cw2 + '"><div class="bc-round-label">Rd 2</div>' + c(pr2[3], 2) + '</div>'
    + '</div>'
    + '</div>'

    + '</div>';
}

function toggleBracket() {

function showRoundupOverlayMaker() {
  var st = _makerState;
  if (!st.pieTotals || !st.gamesData) return;

  function etDate(utcStr) {
    var d = new Date(new Date(utcStr).getTime() - 4*60*60*1000);
    return d.toISOString().slice(0,10);
  }
  var etNow = new Date(Date.now() - 4*60*60*1000);
  var todayET = etNow.toISOString().slice(0,10);
  var yesterdayET = new Date(etNow.getTime() - 86400000).toISOString().slice(0,10);

  var yesterdayGames = st.gamesData.filter(function(g){ return g.startUTC && etDate(g.startUTC)===yesterdayET && (g.state==='OFF'||g.state==='FINAL'); });
  var tonightGames   = st.gamesData.filter(function(g){ return g.startUTC && etDate(g.startUTC)===todayET   && (g.state==='FUT'||g.state==='PRE'); });

  var dateLabel = new Date(yesterdayET+'T12:00:00Z').toLocaleDateString('en-US',{month:'long',day:'numeric',timeZone:'UTC'});
  var lines = ['🏒 PLAYOFF ROUNDUP — '+dateLabel, ''];

  if (yesterdayGames.length === 0) {
    lines.push('No playoff games yesterday.');
    lines.push('');
  } else {
    yesterdayGames.forEach(function(g) {
      var isOT = g.periodType==='OT'||(g.period>3&&g.periodType!=='SO');
      var isSO = g.periodType==='SO';
      var suffix = isSO?' (SO)':isOT?' (OT)':'';
      lines.push(g.away+' '+g.awayScore+' · '+g.home+' '+g.homeScore+suffix);
      var series = getSeriesForTeamsMaker(g.away, g.home);
      var winner=null, loser=null;
      if (series) {
        var w1=series.topWins, w2=series.bottomWins;
        var isOver = w1===4||w2===4;
        if (isOver) {
          winner = w1===4?series.topTeam:series.bottomTeam;
          loser  = w1===4?series.bottomTeam:series.topTeam;
          lines.push(winner+' wins '+Math.max(w1,w2)+'-'+Math.min(w1,w2));
        } else {
          lines.push(w1===w2?'Series tied '+w1+'-'+w2:(w1>w2?series.topTeam:series.bottomTeam)+' leads '+Math.max(w1,w2)+'-'+Math.min(w1,w2));
        }
      }
      var o1m=getTeamOwnerMaker(g.away), o2m=getTeamOwnerMaker(g.home);
      var p1=o1m?o1m.abbrev:null, p2=o2m?o2m.abbrev:null;
      var o1=parseFloat((st.odds[g.away]||'0%').replace('%','')), o2=parseFloat((st.odds[g.home]||'0%').replace('%',''));
      var dm=st.deltaMap||{};
      var arr=function(t){var d=dm[t];return d>0?' ▲':d<0?' ▼':'';};
      var fmt=function(team,odds,player){
        if(team===loser) return team+' eliminated'+(player?' ('+player+')':'');
        return team+arr(team)+' at '+odds.toFixed(1)+'%'+(player?' ('+player+')':'');
      };
      lines.push(fmt(g.away,o1,p1)+', '+fmt(g.home,o2,p2));
      lines.push('');
    });
  }

  // prev-day standings delta
  var prevTotals = {};
  if (st.historyData && st.historyData.length > 0) {
    var todayStr2 = new Date().toISOString().slice(0,10);
    var prevDates = [...new Set(st.historyData.map(function(r){return r.date;}).filter(Boolean))].sort().filter(function(d){return d<todayStr2;});
    var prevDate = prevDates[prevDates.length-1];
    if (prevDate) {
      var prevSnaps = st.historyData.filter(function(r){return r.date===prevDate;});
      st.pieTotals.forEach(function(p) {
        prevTotals[p.abbrev] = p.teams.reduce(function(sum,t){
          var snap=prevSnaps.find(function(r){return r.team===t;});
          return sum+(snap?parseFloat(snap.cup)||0:0);
        },0);
      });
    }
  }

  lines.push('——————————————');
  lines.push('STANDINGS');
  ['🥇','🥈','🥉','4️⃣'].forEach(function(e,i){
    var p=st.pieTotals[i];
    if(!p) return;
    var prev=prevTotals[p.abbrev];
    var arrow=prev!=null?(p.total>prev+0.05?' ▲':p.total<prev-0.05?' ▼':''):'';
    lines.push(e+' '+p.name+' —'+arrow+' '+p.total.toFixed(1)+'%');
  });

  if (tonightGames.length > 0) {
    lines.push('');
    lines.push('——————————————');
    lines.push('TONIGHT');
    tonightGames.forEach(function(g) {
      var series=getSeriesForTeamsMaker(g.away,g.home);
      var ctx='';
      if(series){var w1=series.topWins,w2=series.bottomWins;ctx=w1===w2?' (tied '+w1+'-'+w2+')':' ('+(w1>w2?series.topTeam:series.bottomTeam)+' leads '+Math.max(w1,w2)+'-'+Math.min(w1,w2)+')';}
      var timeStr='';
      try{timeStr=' · '+new Date(g.startUTC).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET';}catch(e){}
      lines.push('🏒 '+g.away+' vs '+g.home+ctx+timeStr);
    });
  }

  var text = lines.join('\n');
  var overlay = document.createElement('div');
  overlay.id = 'roundup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#0d1117;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;box-sizing:border-box;';
  overlay.innerHTML = '<div style="max-width:460px;margin:0 auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;color:#f9fafb">📋 ROUNDUP</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button id="roundup-copy-btn" style="background:#3b82f6;border:none;color:#fff;font-family:Inter,sans-serif;font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer">Copy</button>'
    +'<button onclick="document.getElementById(\'roundup-overlay\').remove()" style="background:rgba(255,255,255,0.08);border:none;color:#9ca3af;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:Inter,sans-serif;font-size:12px">✕</button>'
    +'</div></div>'
    +'<textarea id="roundup-text" readonly style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#f9fafb;font-family:monospace;font-size:12px;line-height:1.7;padding:14px;min-height:420px;resize:none;outline:none;"></textarea>'
    +'</div>';
  document.body.appendChild(overlay);
  document.getElementById('roundup-text').value = text;
  document.getElementById('roundup-copy-btn').onclick = function() {
    navigator.clipboard.writeText(text).then(function(){
      var b=document.getElementById('roundup-copy-btn'); b.textContent='✓ Copied!';
      setTimeout(function(){b.textContent='Copy';},2000);
    });
  };
}

function buildPathToCup(teams, oddsMap, playerColor) {
  var bars = teams
    .map(function(t) { return { t: t, pct: parseFloat((oddsMap[t]||'0%').replace('%','')) }; })
    .sort(function(a,b) { return b.pct - a.pct; });
  var allElim = bars.every(function(x){return x.pct<0.1;});
  var alive = bars.filter(function(x){return x.pct>=0.1;});
  var max = alive.length ? alive[0].pct : 1;
  var inner = bars.map(function(x) {
    var isElim = x.pct < 0.1;
    var w = isElim ? 0 : Math.round((x.pct/max)*100);
    var fill = isElim ? 'rgba(156,163,175,0.35)' : playerColor;
    return '<div class="ptc-bar-row"'+(isElim?' style="opacity:0.4"':'')+'>'+
      '<span class="ptc-label" style="width:22px;text-align:right'+(isElim?';text-decoration:line-through':'')+'">'+x.t+'</span>'+
      '<div class="ptc-bar-track"><div class="ptc-bar-fill" style="width:'+w+'%;background:'+fill+'"></div></div>'+
      '<span class="ptc-label" style="width:30px">'+(isElim?'0.0':x.pct.toFixed(1))+'%</span>'+
      '</div>';
  }).join('');
  return '<div style="margin-top:7px;display:flex;flex-direction:column;gap:4px;padding:0 2px">'+inner+'</div>';
}

function buildRaceSparklineMaker(histData, odds, pool) {
  if (!histData || histData.length < 2 || !pool) return '';
  var today = new Date().toISOString().substring(0,10);
  var dates = [...new Set(histData.map(function(d){return d.date;}).filter(Boolean))].sort();
  if (!dates.includes(today)) dates.push(today);
  if (dates.length < 2) return '';

  var players = pool.players.map(function(p, i) {
    var pc = p.color ? {color:p.color} : getPC(pool, i);
    var abbrev = (p.abbrev || p.name.substring(0,3)).toUpperCase();
    var pts = dates.map(function(date) {
      if (date === today) return p.teams.reduce(function(sum,t){return sum+parseFloat((odds[t]||'0%').replace('%',''));},0);
      return p.teams.reduce(function(sum,team){
        var e=histData.find(function(d){return d.date===date&&(d.team||'').toUpperCase()===team.toUpperCase();});
        return sum+(e?parseFloat(e.cup)||0:0);
      },0);
    });
    return {abbrev:abbrev, color:pc.color, points:pts};
  });

  var allPts=players.reduce(function(acc,p){return acc.concat(p.points);},[]);
  var dataMin=Math.min.apply(null,allPts), dataMax=Math.max.apply(null,allPts);
  var pad=Math.max(1,(dataMax-dataMin)*0.15);
  var yMin=Math.max(0,dataMin-pad), yMax=Math.min(100,dataMax+pad);
  if(yMax===yMin){yMin=0;yMax=50;}

  var W=320,H=72,padL=4,padR=42,padT=6,padB=6;
  var cW=W-padL-padR, cH=H-padT-padB, n=dates.length;
  function gx(i){return padL+(n>1?(i/(n-1))*cW:cW/2);}
  function gy(v){return padT+cH*(1-(v-yMin)/(yMax-yMin));}

  var labels=players.map(function(p){
    return {abbrev:p.abbrev, color:p.color, y:gy(p.points[p.points.length-1])};
  }).sort(function(a,b){return a.y-b.y;});
  for(var i=1;i<labels.length;i++){if(labels[i].y-labels[i-1].y<12)labels[i].y=labels[i-1].y+12;}
  var labelY={};labels.forEach(function(l){labelY[l.abbrev]=l.y;});

  var lines=players.map(function(p){
    var linePts=p.points.map(function(v,i){return gx(i).toFixed(1)+','+gy(v).toFixed(1);}).join(' ');
    var lx=gx(n-1), dotY=gy(p.points[p.points.length-1]);
    return '<polyline points="'+linePts+'" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
      +'<circle cx="'+lx.toFixed(1)+'" cy="'+dotY.toFixed(1)+'" r="2.5" fill="rgba(255,255,255,0.25)"/>'
      +'<text x="'+(lx+6).toFixed(1)+'" y="'+(labelY[p.abbrev]+4).toFixed(1)+'" font-size="9.5" font-weight="700" font-family="Barlow Condensed,sans-serif" fill="'+p.color+'">'+p.abbrev+'</text>';
  }).join('');

function buildOnTheClock(gamesData, oddsMap) {
  if (!gamesData || !gamesData.length) return '';
  var pool = getActivePool(); if (!pool) return '';
  var etNow = new Date(Date.now() - 4*60*60*1000);
  var todayET = etNow.toISOString().slice(0,10);
  var etHour = etNow.getUTCHours();
  var yesterdayET = new Date(etNow.getTime() - 86400000).toISOString().slice(0,10);
  var tonight = gamesData.filter(function(g) {
    if (!g.startUTC) return false;
    if (g.state==='LIVE' || g.state==='CRIT') return true;
    var d = new Date(new Date(g.startUTC).getTime() - 4*60*60*1000);
    var gDate = d.toISOString().slice(0,10);
    if (gDate === todayET) return etHour >= 10 ? (g.state==='FUT'||g.state==='PRE'||g.state==='OFF'||g.state==='FINAL') : (g.state==='OFF'||g.state==='FINAL');
    if (etHour < 10 && gDate === yesterdayET) return g.state==='OFF'||g.state==='FINAL';
    return false;
  });
  if (!tonight.length) return '';
  var html = '<div style="margin-bottom:16px;background:rgba(255,255,255,0.03);border-radius:12px;border-left:3px solid #3b82f6;padding:12px 14px">';
  html += '<div style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.8px;margin-bottom:8px;text-transform:uppercase">🏒 Tonight</div>';
  tonight.forEach(function(g, i) {
    var awayOwner = getTeamOwnerMaker(g.away), homeOwner = getTeamOwnerMaker(g.home);
    var awayCup = parseFloat((oddsMap[g.away]||'0%').replace('%',''));
    var homeCup = parseFloat((oddsMap[g.home]||'0%').replace('%',''));
    var timeStr = '';
    try { timeStr = new Date(g.startUTC).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',hour12:true})+' ET'; } catch(e){}
    var isLive = g.state==='LIVE'||g.state==='CRIT';
    var isFinal = g.state==='OFF'||g.state==='FINAL';
    var hasScore = g.awayScore != null && g.homeScore != null;
    var awayPill = awayOwner ? (function(){var pc=getPC(pool,awayOwner.ci);return '<span class="pill" style="background:'+pc.bg+';color:'+pc.color+';font-size:9px;padding:0 5px;border-radius:4px;font-weight:700">'+esc(awayOwner.abbrev)+'</span>';})() : '';
    var homePill = homeOwner ? (function(){var pc=getPC(pool,homeOwner.ci);return '<span class="pill" style="background:'+pc.bg+';color:'+pc.color+';font-size:9px;padding:0 5px;border-radius:4px;font-weight:700">'+esc(homeOwner.abbrev)+'</span>';})() : '';
    var periodLabel = '';
    if (isLive && g.period) {
      var pt = g.periodType || 'REG';
      periodLabel = pt==='OT'?'OT':pt==='SO'?'SO':('P'+g.period);
    }
    var borderTop = i > 0 ? 'border-top:1px solid rgba(255,255,255,0.05);margin-top:6px;padding-top:6px;' : '';
    var isUpcoming = !isLive && !isFinal;
    var tappable = g.id && (isLive || isFinal);
    var cursor = (tappable || (isUpcoming && g.id)) ? 'cursor:pointer;' : '';
    var onclick = tappable
      ? ' onclick="showLiveGameOverlayMaker(\''+g.id+'\',\''+g.away+'\',\''+g.home+'\',\''+g.season+'\')"'
      : (isUpcoming && g.id ? ' onclick="showGamePreviewOverlayM(\''+g.id+'\',\''+g.away+'\',\''+g.home+'\',\''+g.season+'\')"' : '');
    html += '<div'+onclick+' style="display:flex;align-items:center;gap:4px;'+borderTop+cursor+'overflow:hidden">';
    if (isLive) {
      html += '<div style="flex-shrink:0;min-width:36px">';
      html += '<div style="font-size:10px;color:#f87171;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px;display:flex;align-items:center"><span class="live-dot"></span>LIVE</div>';
      if (periodLabel) html += '<div style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif">'+periodLabel+'</div>';
      html += '</div>';
    } else if (isFinal) {
      html += '<span style="font-size:10px;color:#6b7280;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;flex-shrink:0;letter-spacing:.3px">FINAL</span>';
    } else {
      html += '<span style="font-size:11px;color:#4b5563;font-family:\'Barlow Condensed\',sans-serif;flex-shrink:0">'+timeStr+'</span>';
    }
    html += '<img src="https://assets.nhle.com/logos/nhl/svg/'+g.away+'_'+logoSfx(g.away)+'.svg" style="width:22px;height:22px;object-fit:contain;flex-shrink:0" onerror="this.style.display=\'none\'">';
    html += '<span style="font-size:14px;font-family:\'Barlow Condensed\',sans-serif;font-weight:800;color:#f9fafb;flex-shrink:0">'+g.away+'</span>';
    html += awayPill;
    html += '<span style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;flex-shrink:0">'+awayCup.toFixed(1)+'%</span>';
    if ((isLive || isFinal) && hasScore) {
      html += '<span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:17px;color:#f9fafb;flex-shrink:0">'+g.awayScore+' <span style="color:#374151;font-weight:400">·</span> '+g.homeScore+'</span>';
    } else {
      html += '<span style="font-size:11px;color:#374151;font-family:\'Barlow Condensed\',sans-serif;flex-shrink:0">vs</span>';
    }
    html += '<span style="font-size:10px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif;flex-shrink:0">'+homeCup.toFixed(1)+'%</span>';
    html += homePill;
    html += '<span style="font-size:14px;font-family:\'Barlow Condensed\',sans-serif;font-weight:800;color:#f9fafb;flex-shrink:0">'+g.home+'</span>';
    html += '<img src="https://assets.nhle.com/logos/nhl/svg/'+g.home+'_'+logoSfx(g.home)+'.svg" style="width:22px;height:22px;object-fit:contain;flex-shrink:0" onerror="this.style.display=\'none\'">';
    if (isLive && g.id) {
      html += '<span onclick="event.stopPropagation();showGamePreviewOverlayM(\''+g.id+'\',\''+g.away+'\',\''+g.home+'\',\''+g.season+'\')" style="font-size:9px;color:#4b5563;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.5px;margin-left:auto;flex-shrink:0;cursor:pointer;padding:2px 5px;border:1px solid #374151;border-radius:4px;-webkit-tap-highlight-color:transparent">PREVIEW</span>';
      html += '<span style="font-size:11px;color:#4b5563;flex-shrink:0">&#9654;&#xFE0E;</span>';
    } else if (tappable || (isUpcoming && g.id)) {
      html += '<span style="font-size:11px;color:#4b5563;margin-left:auto;flex-shrink:0">&#9654;&#xFE0E;</span>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

  }).slice(0, 20);

    points:        {val:function(p){return p.points||0;},        sub:function(p){return (p.goals||0)+'G '+(p.assists||0)+'A';},  unit:'pts'},
    hits:          {val:function(p){return p.hits||0;},          sub:function(p){return (p.gamesPlayed||0)+' GP';},              unit:'HIT'},
    blockedShots:  {val:function(p){return p.blockedShots||0;},  sub:function(p){return (p.gamesPlayed||0)+' GP';},              unit:'BLK'},
    takeaways:     {val:function(p){return p.takeaways||0;},     sub:function(p){return (p.gamesPlayed||0)+' GP';},              unit:'TK'},
    giveaways:     {val:function(p){return p.giveaways||0;},     sub:function(p){return (p.gamesPlayed||0)+' GP';},              unit:'GV'},
    penaltiesDrawn:{val:function(p){return p.penaltiesDrawn||0;},sub:function(p){return (p.gamesPlayed||0)+' GP';},              unit:'PD'}
  };
  var m = META[cat] || META.points;

    html += '<div onclick="showPlayerCard(\'s_'+p.playerId+'\')" style="flex-shrink:0;width:62px;text-align:center;cursor:pointer">';
    html += '<div style="position:relative;display:inline-block">';
    html += '<img src="'+shot+'" style="width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:top center;background:#1f2937;display:block" onerror="this.src=\'https://assets.nhle.com/logos/nhl/svg/'+team+'_'+logoSfx(team)+'.svg\'">';
    html += '<img src="https://assets.nhle.com/logos/nhl/svg/'+team+'_'+logoSfx(team)+'.svg" style="width:16px;height:16px;position:absolute;bottom:-2px;right:-4px;background:#0d1117;border-radius:50%;padding:1px;object-fit:contain">';
    html += '</div>';

    html += '<div style="font-size:11px;font-weight:700;color:#f9fafb;font-family:\'Barlow Condensed\',sans-serif">'+m.val(p)+'<span style="font-size:9px;font-weight:400;color:#6b7280"> '+m.unit+'</span></div>';
    html += '<div style="font-size:9px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif">'+m.sub(p)+'</div>';
    html += '<div style="display:flex;justify-content:center;margin-top:3px">'+pillHtml+'</div>';
    html += '</div>';
  });
  return html;

function formatGameTime(utcStr) {
  var d = new Date(utcStr);
  // NHL uses noon UTC as placeholder when game time isn't confirmed
  if (d.getUTCHours() === 12 && d.getUTCMinutes() === 0) return "TBD";
  var dET = new Date(d.getTime() - 4 * 3600000);
  var h = dET.getUTCHours(), m = dET.getUTCMinutes();
  var ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + (m ? ":" + String(m).padStart(2,"0") : "") + " " + ampm;
}

function isSeriesLive(gd,t1,t2){
  if(!gd||!gd.length)return false;
  return gd.some(function(g){return[g.away,g.home].indexOf(t1)>=0&&[g.away,g.home].indexOf(t2)>=0&&(g.state==='LIVE'||g.state==='CRIT');});
}

function getGameBadge(gamesData, t1, t2) {
  if (!gamesData || !gamesData.length) return "";
  var today = new Date().toDateString();
  for (var i = 0; i < gamesData.length; i++) {
    var g = gamesData[i];
    if ([g.away,g.home].indexOf(t1)<0 || [g.away,g.home].indexOf(t2)<0) continue;
    if (!g.startUTC) continue;
    function toEasternDate2(utcStr) {
      var ET_OFFSET=-4*3600000,d=new Date(new Date(utcStr).getTime()+ET_OFFSET);
      if(d.getUTCHours()<5)d.setUTCDate(d.getUTCDate()-1);
      return d.toISOString().substring(0,10);
    }
    var gameUTCDate = toEasternDate2(g.startUTC);
    var nowEastern = toEasternDate2(new Date().toISOString());
    if (gameUTCDate !== nowEastern) continue;
    var as = g.awayScore !== null ? g.awayScore : 0;
    var hs = g.homeScore !== null ? g.homeScore : 0;
    if (g.state === "FUT" || g.state === "PRE") return '<span class="game-badge">'+formatGameTime(g.startUTC)+'</span>';
    if (g.state === "LIVE" || g.state === "CRIT") return '<span class="game-badge live">'+g.away+' '+as+' : '+hs+' '+g.home+(g.period?' P'+g.period:'')+'</span>';
    if (g.state === "FINAL" || g.state === "OFF") return '<span class="game-badge final">'+g.away+' '+as+' : '+hs+' '+g.home+' F</span>';
  }
  return "";
}

      if(typeof v==='string'){odds[team]=v;}
      else if(typeof v==='object'&&v!==null){if(v.cup)odds[team]=v.cup;roundOdds[team]={r2:v.r2||'',r3:v.r3||'',r4:v.r4||'',cup:v.cup||''};}
    });
    // Odds delta — walk back per team to find most recent snapshot where odds actually differed
    var deltaMap={};
    try{
      if(historyData&&historyData.length>0){
        var todayStr=new Date().toISOString().substring(0,10);
        var histDates=[...new Set(historyData.map(function(r){return r.date;}).filter(Boolean))].sort()
          .filter(function(d){return d<todayStr;});
        Object.keys(odds).forEach(function(t){
          var cur=parseFloat((odds[t]||'0%').replace('%',''));
          for(var di=histDates.length-1;di>=0;di--){
            var snap=historyData.find(function(r){return r.date===histDates[di]&&r.team&&r.team.toUpperCase()===t;});
            if(snap){
              var prev=parseFloat(snap.cup)||0;
              var d=parseFloat((cur-prev).toFixed(1));
              if(Math.abs(d)>=0.1){deltaMap[t]=d;break;}
            }
          }
        });
      }
    }catch(e){}
    var parsed=parseSeries(nhlRaw)||{r1w:R1W.map(function(m){return{topTeam:m.t,bottomTeam:m.b,topWins:0,bottomWins:0};}),
      r1e:R1E.map(function(m){return{topTeam:m.t,bottomTeam:m.b,topWins:0,bottomWins:0};}),r2:[null,null,null,null],r3:[null,null],r4:null};
    var rw=parsed.r1w,re=parsed.r1e,r2f=parsed.r2,r3=parsed.r3,r4=parsed.r4;
    // Zero out odds for eliminated teams (series decided = 4 wins) so we don't wait on MoneyPuck
    // Also track which round each team was eliminated in for sorted display
    var elimRound={};
    var seriesByRound=[
      rw.map(function(s){return{s:s,r:1};}),
      re.map(function(s){return{s:s,r:1};}),
      r2f.map(function(s){return{s:s,r:2};}),
      r3.map(function(s){return{s:s,r:3};}),
      r4?[{s:r4,r:4}]:[]
    ].reduce(function(a,b){return a.concat(b);}).filter(function(x){return x.s;});
    seriesByRound.forEach(function(x){
      var s=x.s,loser=null;
      if(s.topWins===4&&s.bottomWins<4) loser=s.bottomTeam;
      else if(s.bottomWins===4&&s.topWins<4) loser=s.topTeam;
      if(loser&&loser!=='TBD'){
        odds[loser]='0%';
        roundOdds[loser]={r2:'0%',r3:'0%',r4:'0%',cup:'0%'};
        elimRound[loser]=x.r;
      }
    });
    var r2disp=[
      augmentPartialR2(r2f[0]||predictedMatchup(rw[0],rw[1]),rw[0],rw[1]),
      augmentPartialR2(r2f[1]||predictedMatchup(rw[2],rw[3]),rw[2],rw[3]),
      augmentPartialR2(r2f[2]||predictedMatchup(re[0],re[1]),re[0],re[1]),
      augmentPartialR2(r2f[3]||predictedMatchup(re[2],re[3]),re[2],re[3]),
    ];
    var r2HasTeams=r2f.some(function(s){return s&&s.topTeam&&s.topTeam!=="TBD";});
    var r2AllTeams=r2f.every(function(s){return s&&s.topTeam&&s.topTeam!=="TBD"&&s.bottomTeam&&s.bottomTeam!=="TBD";});
    var r3HasTeams=r3.some(function(s){return s&&((s.topTeam&&s.topTeam!=="TBD")||(s.bottomTeam&&s.bottomTeam!=="TBD"));});
    var r3AllTeams=r3.length>=2&&r3.every(function(s){return s&&s.topTeam&&s.topTeam!=="TBD"&&s.bottomTeam&&s.bottomTeam!=="TBD";});
    var r4HasTeams=Boolean(r4&&((r4.topTeam&&r4.topTeam!=="TBD")||(r4.bottomTeam&&r4.bottomTeam!=="TBD")));
    var r1body='<div class="clabels"><div class="clabel">Western Conference</div><div class="clabel">Eastern Conference</div></div>'
      +'<div class="four-col">'+rw.map(function(s,i){return seriesCard(s,"Round 1",odds,gamesRaw,deltaMap,roundOdds,1,historyData)+seriesCard(re[i],"Round 1",odds,gamesRaw,deltaMap,roundOdds,1,historyData);}).join("")+'</div>';
    var html=makeRoundSection('r1','Round 1',r1body,r2AllTeams);
    var r2body='<div class="clabels"><div class="clabel">Western Conference</div><div class="clabel">Eastern Conference</div></div>'
      +'<div class="four-col">'+seriesCard(r2disp[0],"West R2",odds,gamesRaw,deltaMap,roundOdds,2,historyData)+seriesCard(r2disp[2],"East R2",odds,gamesRaw,deltaMap,roundOdds,2,historyData)+seriesCard(r2disp[1],"West R2",odds,gamesRaw,deltaMap,roundOdds,2,historyData)+seriesCard(r2disp[3],"East R2",odds,gamesRaw,deltaMap,roundOdds,2,historyData)+'</div>';
    html+=makeRoundSection('r2','Round 2',r2body,!r2HasTeams||r3AllTeams);
    var r3body='<div class="two-col">'+seriesCard(r3?r3[0]:null,"West CF",odds,gamesRaw,deltaMap,roundOdds,3,historyData)+seriesCard(r3?r3[1]:null,"East CF",odds,gamesRaw,deltaMap,roundOdds,3,historyData)+'</div>';
    html+=makeRoundSection('r3','Conference Finals',r3body,!r3HasTeams);
    var r4body='<div class="one-col">'+seriesCard(r4,"Stanley Cup Final",odds,gamesRaw,deltaMap,roundOdds,4,historyData)+'</div>';
    html+=makeRoundSection('r4','Stanley Cup Final',r4body,!r4HasTeams);
    document.getElementById("main").innerHTML=html;
    var activePool=getActivePool();
    var pieTotals2=(activePool?activePool.players:[]).map(function(p,i){
      var total=0;
      p.teams.forEach(function(t){total+=parseFloat((odds[t]||"0%").replace("%",""));});
      return {name:p.name,abbrev:p.abbrev||p.name.substring(0,3),total:total,teams:p.teams,ci:i,color:p.color||null};
    }).sort(function(a,b){return b.total-a.total;});
    var pieSvg = buildPieChart(pieTotals2,ALL_COLORS);
    _makerState = {pieTotals:pieTotals2, pieSvg:pieSvg, odds:odds, roundOdds:roundOdds, historyData:historyData, parsed:parsed, gamesData:gamesRaw, deltaMap:deltaMap, pool:getActivePool(), leaders:leaders, goalies:goalies, elimRound:elimRound};
    // cache standings snapshot for My Pools display
    (function(){
      var aid=getActiveId();if(!aid)return;var ps=getAllPools();if(!ps[aid])return;
      // compute prev-day totals per player (same logic as roundup standings delta)
      var prevTotalsC={};
      if(historyData&&historyData.length>0){
        var todayC=new Date().toISOString().slice(0,10);
        var prevDatesC=[...new Set(historyData.map(function(r){return r.date;}).filter(Boolean))].sort().filter(function(d){return d<todayC;});
        var prevDateC=prevDatesC[prevDatesC.length-1];
        if(prevDateC){
          var prevSnapsC=historyData.filter(function(r){return r.date===prevDateC;});
          pieTotals2.forEach(function(p){
            prevTotalsC[p.abbrev]=p.teams.reduce(function(sum,t){
              var snap=prevSnapsC.find(function(r){return r.team===t;});
              return sum+(snap?parseFloat(snap.cup)||0:0);
            },0);
          });
        }
      }
      ps[aid]._standings=pieTotals2.map(function(p,i){
        var prev=prevTotalsC[p.abbrev];
        var d=(prev!=null)?parseFloat((p.total-prev).toFixed(2)):0;
        return{abbrev:p.abbrev,name:p.name,total:p.total,rank:i+1,delta:d};
      });
      savePools(ps);
    })();
    document.getElementById("legwrap").innerHTML = buildLegend(pieSvg);
    document.getElementById("tonight-wrap").innerHTML = buildOnTheClock(gamesRaw, odds);
    document.getElementById("swrap").innerHTML=buildStandings(odds,historyData)+buildTeamOdds(odds,roundOdds,historyData,elimRound)+'<div id="all-leaders-wrap">'+buildScoringLeaders(leaders,odds)+buildGoalieLeaders(goalies,odds)+buildEdgeButton()+'</div>';
    document.getElementById("sub").textContent="Live NHL scores + MoneyPuck odds · Updated "+new Date().toLocaleTimeString();
    refreshBracketIfOpen();
    initTour();
  }catch(e){
    document.getElementById("main").innerHTML='<div class="loading">Error: '+e.message+'</div>';
    document.getElementById("sub").textContent="Failed to load";
  }
}

// ─── GUIDED TOUR ─────────────────────────────────────────────────────────────
// 4-panel backdrop with CSS transitions for smooth step-to-step animation.
// Panels and ring animate their position via CSS; tip cross-fades between steps.
// Target elements are NEVER modified — sidesteps all CSS stacking-context issues.
var _tourActive=false,_tourStep=0,_tourPanels=[],_tourRing=null,_tourTip=null,_tourSeriesId=null;
var _TOUR_TRANSITION='top 0.35s cubic-bezier(0.4,0,0.2,1),left 0.35s cubic-bezier(0.4,0,0.2,1),width 0.35s cubic-bezier(0.4,0,0.2,1),height 0.35s cubic-bezier(0.4,0,0.2,1),right 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.28s ease';

var _tourSteps=[
  // 1 — Standings: force user to tap their card (personalizes + auto-advances)
  {sel:'.sgrid', pos:'bottom', waitForTap:true, fixedBottom:true,
   title:'Standings',
   body:'Who\'s leading the pool at a glance. <b style="color:#f9fafb">Tap your card</b> to personalize your view — your colour highlights throughout the app.'},

  // 2 — The card they just selected
  {selFn:function(){return document.querySelector('.scard.me-card')||document.querySelector('.scard');},
   pos:'bottom',
   title:'Your Picks',
   body:'Your card shows your teams\' combined cup odds. Tap the mini chart to open the full odds history and overlay other players for comparison.'},

  // 3a — Series card collapsed: live scores, deltas, cup odds
  {selFn:function(){
     var s=document.querySelector('#rs-r2:not(.is-collapsed) .live-series')||document.querySelector('.round-section:not(.is-collapsed) .live-series')||document.querySelector('#rs-r2:not(.is-collapsed) .series')||document.querySelector('.round-section:not(.is-collapsed) .series');
     if(s){var m=(s.getAttribute('onclick')||'').match(/toggleSeriesGames\('([^']+)'/);if(m)_tourSeriesId=m[1];}
     return s;
   }, pos:'bottom',
   title:'Series Cards',
   body:'Each matchup shows live series scores, current cup odds, and Δ changes. Live games get a pulsing dot with real-time score updates.'},

  // 3b — Same series expanded: sparklines + game rows
  {selFn:function(){
     if(_tourSeriesId){var sg=document.getElementById('sg-'+_tourSeriesId);if(sg)return sg.parentElement;}
     return document.querySelector('#rs-r2:not(.is-collapsed) .series')||document.querySelector('.round-section:not(.is-collapsed) .series');
   }, pos:'bottom',
   before:function(){
     if(_tourSeriesId){var sg=document.getElementById('sg-'+_tourSeriesId);if(sg&&sg.offsetHeight===0)toggleSeriesGames(_tourSeriesId);}
   },
   after:function(){
     if(_tourSeriesId){var sg=document.getElementById('sg-'+_tourSeriesId);if(sg&&sg.offsetHeight>0)toggleSeriesGames(_tourSeriesId);}
   },
   title:'Expanded Card',
   body:'Tap any matchup to expand — odds sparklines for both teams, game-by-game results, and tap any game row for past or live analysis.'},

  // 4 — Tonight's games
  {sel:'#tonight-wrap', pos:'bottom', noFlip:true,
   title:'Tonight\'s Games',
   body:'Live scores and upcoming matchups at a glance. Tap any game card to open full live analysis or pregame preview.'},

  // 5 — Bracket button in header; bracket opens behind for context
  {selFn:function(){return document.querySelector('button[onclick="toggleBracket()"]');},
   pos:'bottom',
   before:function(){
     window.scrollTo({top:0,behavior:'instant'});
     var bs=document.getElementById('bracket-section');
     if(bs&&bs.style.display==='none'){bs.style.display='block';bs.innerHTML=buildBracket();}
   },
   after:function(){var bs=document.getElementById('bracket-section');if(bs)bs.style.display='none';},
   title:'Playoff Bracket',
   body:'Tap here anytime to open the full playoff bracket — win probabilities, pool colours, and series results at a glance.'},

  // 6 — All leaders sections together; scroll to bottom so tooltip floats above
  {sel:'#all-leaders-wrap', pos:'top', scrollBlock:'end',
   title:'Leaders & Fun Stats',
   body:'Top scorers, goalie leaders, and fun edge stats from your pool teams. Switch categories with the tabs above.'}
];

function _tourKey(){var p=getActivePool();return'tourDone_'+(p?(p.id||p.title||'x'):'x');}

function initTour(){
  if(localStorage.getItem(_tourKey()))return;
  if(window._pwaOverlayActive)return; // PWA overlay is showing — it triggers tour on dismiss
  setTimeout(_tourShowIntro,1000);
}

function _tourShowIntro(){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:10009;background:rgba(0,0,0,0.62);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease';
  var card=document.createElement('div');
  card.style.cssText='background:#1c2333;border:1px solid rgba(255,255,255,0.13);border-radius:18px;padding:28px 24px;width:272px;box-shadow:0 12px 48px rgba(0,0,0,0.7);font-family:Inter,sans-serif;text-align:center;transform:translateY(10px);transition:transform 0.3s ease';
  card.innerHTML=
    '<div style="font-size:34px;margin-bottom:14px">🏒</div>'+
    '<div style="font-size:20px;font-weight:700;color:#f9fafb;margin-bottom:8px;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px">Welcome to the pool!</div>'+
    '<div style="font-size:13px;color:#9ca3af;line-height:1.6;margin-bottom:22px">Want a quick tour of all the features?</div>'+
    '<button id="_tour-intro-go" style="width:100%;background:#3b82f6;border:none;color:#fff;border-radius:10px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent;margin-bottom:10px">Let\'s go →</button>'+
    '<button id="_tour-intro-skip" style="width:100%;background:none;border:none;color:#6b7280;font-size:12px;cursor:pointer;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent;padding:4px 0">Skip for now</button>';
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  requestAnimationFrame(function(){
    overlay.style.opacity='1';
    card.style.transform='translateY(0)';
  });
  function dismiss(){overlay.style.opacity='0';setTimeout(function(){if(overlay.parentNode)overlay.remove();},300);}
  document.getElementById('_tour-intro-go').onclick=function(){dismiss();setTimeout(startTour,300);};
  document.getElementById('_tour-intro-skip').onclick=function(){dismiss();localStorage.setItem(_tourKey(),'1');};
}

function _tourMakePanel(){
  var d=document.createElement('div');
  d.style.position='fixed';
  d.style.background='rgba(0,0,0,0.62)';
  d.style.zIndex='10010';
  d.style.opacity='0'; // start invisible; fade in on first step
  document.body.appendChild(d);
  return d;
}

function startTour(){
  if(_tourActive)return;
  _tourActive=true; _tourStep=0; _tourSeriesId=null;
  _tourPanels=[_tourMakePanel(),_tourMakePanel(),_tourMakePanel(),_tourMakePanel()];
  _tourRing=document.createElement('div');
  _tourRing.style.cssText='position:fixed;pointer-events:none;z-index:10011;border:3px solid rgba(59,130,246,0.9);border-radius:12px;box-shadow:0 0 0 1px rgba(59,130,246,0.2);opacity:0';
  document.body.appendChild(_tourRing);
  _tourTip=document.createElement('div');
  _tourTip.style.cssText='position:fixed;z-index:10012;width:272px;background:#1c2333;border:1px solid rgba(255,255,255,0.13);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,0.65);font-family:Inter,sans-serif;opacity:0;transition:opacity 0.2s ease,transform 0.2s ease';
  document.body.appendChild(_tourTip);
  _tourShowStep(0);
}

function _tourUpdateSpotlight(el,step){
  var pad=6;
  var r=el.getBoundingClientRect();
  var vw=window.innerWidth,vh=window.innerHeight;
  var x1=Math.max(0,r.left-pad),y1=Math.max(0,r.top-pad);
  var x2=Math.min(vw,r.right+pad),y2=Math.min(vh,r.bottom+pad);
  var pe=step.waitForTap?'none':'all';
  // top
  var p=_tourPanels[0];
  p.style.top='0';p.style.left='0';p.style.right='0';p.style.bottom='';p.style.height=y1+'px';p.style.width='';p.style.pointerEvents=pe;
  // bottom
  p=_tourPanels[1];
  p.style.top=y2+'px';p.style.left='0';p.style.right='0';p.style.bottom='0';p.style.height='';p.style.width='';p.style.pointerEvents=pe;
  // left
  p=_tourPanels[2];
  p.style.top=y1+'px';p.style.left='0';p.style.right='';p.style.bottom='';p.style.width=x1+'px';p.style.height=(y2-y1)+'px';p.style.pointerEvents=pe;
  // right
  p=_tourPanels[3];
  p.style.top=y1+'px';p.style.left=x2+'px';p.style.right='0';p.style.bottom='';p.style.width='';p.style.height=(y2-y1)+'px';p.style.pointerEvents=pe;
  // ring
  _tourRing.style.left=x1+'px';_tourRing.style.top=y1+'px';
  _tourRing.style.width=(x2-x1)+'px';_tourRing.style.height=(y2-y1)+'px';
  if(!step.waitForTap){_tourPanels.forEach(function(q){q.onclick=function(){_tourNext();};});}
  else{_tourPanels.forEach(function(q){q.onclick=null;});}
}

function _tourShowStep(idx){
  _tourStep=idx;
  var step=_tourSteps[idx];
  if(!step){endTour();return;}
  if(step.before)step.before();

  var el=step.selFn?step.selFn():document.querySelector(step.sel);
  if(!el){_tourShowStep(idx+1);return;}

  el.scrollIntoView({behavior:'instant',block:step.scrollBlock||'center'});

  // Fade tip out on step transitions
  if(idx>0){_tourTip.style.opacity='0';_tourTip.style.transform='translateY(6px)';}

  // Update panel positions — CSS transition animates the movement
  _tourUpdateSpotlight(el,step);

  if(idx===0){
    // First step: positions are set, now enable transitions and fade everything in
    requestAnimationFrame(function(){
      _tourPanels.forEach(function(p){p.style.transition=_TOUR_TRANSITION;p.style.opacity='1';});
      _tourRing.style.transition=_TOUR_TRANSITION;
      _tourRing.style.opacity='1';
    });
  }

  if(step.waitForTap){
    var _origSMP=window.setMyPlayer;
    window.setMyPlayer=function(abbrev){
      _origSMP.call(this,abbrev);
      window.setMyPlayer=_origSMP;
      setTimeout(function(){_tourShowStep(_tourStep+1);},500);
    };
  }

  // Show tip after panels begin animating (200ms for transitions, 120ms on first appear)
  setTimeout(function(){_tourRenderTip(idx,el,step);},idx===0?120:200);
}

function _tourRenderTip(idx,el,step){
  var isLast=idx===_tourSteps.length-1;
  var backBtn=idx>0?'<button onclick="_tourPrev()" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#d1d5db;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent">← Back</button>':'';
  var nextBtn=step.waitForTap
    ?'<span style="font-size:11px;color:#6b7280;font-style:italic;align-self:center">↑ tap your card to continue</span>'
    :'<button onclick="'+(isLast?'endTour()':'_tourNext()')+'" style="background:#3b82f6;border:none;color:#fff;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent">'+(isLast?'Done ✓':'Next →')+'</button>';
  _tourTip.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
      '<span style="font-size:10px;letter-spacing:.5px;color:#6b7280;font-family:\'Barlow Condensed\',sans-serif">'+(idx+1)+' / '+_tourSteps.length+'</span>'+
      '<button onclick="endTour()" style="background:none;border:none;color:#6b7280;font-size:12px;cursor:pointer;padding:0 4px;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent">Skip</button>'+
    '</div>'+
    '<div style="font-size:16px;font-weight:700;color:#f9fafb;margin-bottom:6px;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px">'+step.title+'</div>'+
    '<div style="font-size:13px;color:#d1d5db;line-height:1.55;margin-bottom:14px">'+step.body+'</div>'+
    '<div style="display:flex;justify-content:'+(step.waitForTap?'flex-end':'space-between')+'">'+
      (step.waitForTap?'':backBtn)+
      nextBtn+
    '</div>';
  var rect=el.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  var tw=Math.min(272,vw-16),tipPad=12,th=200;
  var left,top;
  if(step.fixedBottom){
    left=Math.max(8,(vw-tw)/2);
    top=vh-th-24;
  }else{
    left=Math.max(8,Math.min(rect.left+(rect.width-tw)/2,vw-tw-8));
    if(step.pos==='bottom'){
      top=rect.bottom+tipPad;
      if(!step.noFlip&&top+th>vh)top=rect.top-th-tipPad;
      top=Math.min(top,vh-th-8);
    }else{
      top=rect.top-th-tipPad;
      if(top<8)top=rect.bottom+tipPad;
    }
  }
  top=Math.max(8,top);
  _tourTip.style.left=left+'px';_tourTip.style.width=tw+'px';
  _tourTip.style.top=top+'px';_tourTip.style.transform='translateY(6px)';
  requestAnimationFrame(function(){_tourTip.style.opacity='1';_tourTip.style.transform='translateY(0)';});
}

function _tourNext(){
  var step=_tourSteps[_tourStep];
  if(step&&step.after)step.after();
  _tourShowStep(_tourStep+1);
}
function _tourPrev(){_tourShowStep(_tourStep-1);}

function endTour(){
  var step=_tourSteps[_tourStep];
  if(step&&step.after)step.after();
  // Fade out panels and ring, then remove
  var dying=_tourPanels.slice(); _tourPanels=[];
  dying.forEach(function(p){p.style.opacity='0';setTimeout(function(){if(p.parentNode)p.remove();},350);});
  if(_tourRing){var ring=_tourRing;_tourRing=null;ring.style.opacity='0';setTimeout(function(){if(ring.parentNode)ring.remove();},350);}
  if(_tourTip){var tip=_tourTip;_tourTip=null;tip.style.opacity='0';setTimeout(function(){if(tip.parentNode)tip.remove();},220);}
  localStorage.setItem(_tourKey(),'1');
  _tourActive=false;
  setTimeout(function(){
    window.scrollTo({top:0,behavior:'smooth'});
    var toast=document.createElement('div');
    toast.style.cssText='position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:10px 22px;font-size:13px;font-weight:600;color:#f9fafb;font-family:Inter,sans-serif;z-index:10000;opacity:0;transition:opacity .35s;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.5)';
    toast.textContent='🏒  Enjoy the pool — happy playoffs!';
    document.body.appendChild(toast);
    requestAnimationFrame(function(){toast.style.opacity='1';});
    setTimeout(function(){toast.style.opacity='0';setTimeout(function(){toast.remove();},400);},2200);
  },380);
}

// Deterministic pool ID from shared link data — prevents duplicates on repeated opens
function _sharedPoolId(data){
  var str=(data.title||'')+JSON.stringify(data.players);
  var h=5381;
  for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}
  return 'sp'+(h>>>0).toString(36);
}

document.addEventListener("DOMContentLoaded",function(){
  var hash=window.location.hash;
  var isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
  if(hash&&hash.startsWith('#pool=')){
    try{
      var encoded=hash.slice(6);
      var data=JSON.parse(decodeURIComponent(escape(atob(encoded))));
      if(data&&data.players&&data.players.length){
        var id=_sharedPoolId(data);
        var pools=getAllPools();
        if(!pools[id]){
          pools[id]={id:id,title:data.title||"Playoff Pool",players:data.players,created:Date.now()};
          savePools(pools);
        }
        setActiveId(id);
        // In standalone mode the user already has the icon — safe to clean up the URL.
        // In browser mode, keep the hash so "Add to Home Screen" captures the pool URL.
        // The PWA overlay's dismiss() will strip it once the user skips installation.
        if(isStandalone){history.replaceState(null,'',window.location.pathname);}
      }
    }catch(e){}
  }
  var pool=getActivePool();
  if(!pool){showPoolList();}else{showSection("main");doRender();}
});
setInterval(function(){var p=getActivePool();if(p&&document.getElementById("main").style.display!=="none")doRender();},300000);
</script>

<script>
// PWA install overlay — full-screen "save to home screen" prompt on first visit
(function(){
  var KEY='pwa_banner_v1';
  if(localStorage.getItem(KEY))return;
  var isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
  if(isStandalone)return;
  var ua=navigator.userAgent;
  var isIOS=/iphone|ipad|ipod/i.test(ua);
  var isAndroid=/android/i.test(ua);
  if(!isIOS&&!isAndroid)return;

  window._pwaOverlayActive=true;
  localStorage.setItem(KEY,'1');
  var deferredPrompt=null;

  function dismiss(){
    var ov=document.getElementById('_pwa-ov');
    if(ov){ov.style.opacity='0';setTimeout(function(){if(ov.parentNode)ov.remove();},350);}
    window._pwaOverlayActive=false;
    // User skipped installation — safe to clean up the hash from the address bar
    if(window.location.hash){history.replaceState(null,'',window.location.pathname);}
    // Hand off to tour once overlay is gone
    if(typeof _tourShowIntro==='function'&&typeof _tourKey==='function'&&!localStorage.getItem(_tourKey())){
      setTimeout(_tourShowIntro,500);
    }
  }

  function _step(n,html){
    return '<div style="display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,0.05);border-radius:12px;padding:12px 14px">'+
      '<div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:Inter,sans-serif;margin-top:1px">'+n+'</div>'+
      '<div style="font-size:13px;color:#d1d5db;line-height:1.55;font-family:Inter,sans-serif">'+html+'</div>'+
    '</div>';
  }

  var shareIconSvg='<svg style="display:inline-block;vertical-align:-4px;margin:0 2px" width="16" height="18" viewBox="0 0 16 18" fill="none"><path d="M8 12V1M3 5l5-5 5 5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 10v7h14v-7" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function showOverlay(type){
    if(!document.getElementById('_pwa-kf')){
      var s=document.createElement('style');s.id='_pwa-kf';
      s.textContent='@keyframes _pwaB{0%,100%{opacity:0.9;transform:translateX(-50%) translateY(0)}50%{opacity:0.4;transform:translateX(-50%) translateY(8px)}}';
      document.head.appendChild(s);
    }
    var ov=document.createElement('div');
    ov.id='_pwa-ov';
    ov.style.cssText='position:fixed;inset:0;z-index:20000;background:rgba(8,12,24,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;opacity:0;transition:opacity 0.35s ease';

    var inner=
      '<div style="font-size:42px;margin-bottom:18px;line-height:1">🏒</div>'+
      '<div style="font-size:23px;font-weight:700;color:#f9fafb;margin-bottom:8px;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.3px;text-align:center">Save to your home screen</div>'+
      '<div style="font-size:13px;color:#9ca3af;line-height:1.65;margin-bottom:26px;text-align:center;max-width:270px">Install the pool app for the best experience — works like a native app, no App Store needed.</div>';

    var _icShare='<svg style="display:inline-block;vertical-align:-3px;margin:0 2px 0 4px" width="14" height="16" viewBox="0 0 14 16" fill="none"><path d="M7 10V1M2.5 4L7 0l4.5 4" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 8v7h12V8" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var _icAdd='<svg style="display:inline-block;vertical-align:-3px;margin:0 2px 0 4px" width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="0.8" y="0.8" width="13.4" height="13.4" rx="2.8" stroke="#e5e7eb" stroke-width="1.6"/><path d="M7.5 4.5v6M4.5 7.5h6" stroke="#e5e7eb" stroke-width="1.6" stroke-linecap="round"/></svg>';
    if(type==='ios'){
      inner+=
        '<div style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;margin-bottom:30px">'+
          _step('1','Tap <b style="color:#e5e7eb">···</b> at the bottom of Safari, then tap'+_icShare+' <b style="color:#e5e7eb">Share</b>')+
          _step('2','Swipe up or tap <b style="color:#e5e7eb">View More</b>, then tap'+_icAdd+' <b style="color:#e5e7eb">Add to Home Screen</b>')+
          _step('3','Tap <b style="color:#e5e7eb">Add</b> in the top right')+
        '</div>'+
        '<button id="_pwa-later" style="background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;padding:8px 20px;-webkit-tap-highlight-color:transparent">I\'ll do it later</button>';
    }else{
      inner+=
        '<button id="_pwa-install" style="width:100%;max-width:300px;background:#3b82f6;border:none;color:#fff;border-radius:12px;padding:15px 0;font-size:15px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;margin-bottom:12px;-webkit-tap-highlight-color:transparent">Add to Home Screen</button>'+
        '<button id="_pwa-later" style="background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;font-family:Inter,sans-serif;padding:8px 20px;-webkit-tap-highlight-color:transparent">I\'ll do it later</button>';
    }

    var card=document.createElement('div');
    card.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px';
    card.innerHTML=inner;
    ov.appendChild(card);

    // Pulsing arrow pointing toward Safari's share button at bottom of screen
    if(type==='ios'){
      var arr=document.createElement('div');
      arr.style.cssText='position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;align-items:center;gap:3px;animation:_pwaB 1.6s ease-in-out infinite;pointer-events:none';
      arr.innerHTML=
        '<span style="font-size:10px;color:#60a5fa;font-family:Inter,sans-serif;font-weight:600;letter-spacing:.8px;text-transform:uppercase">··· here</span>'+
        '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v12M3 9l6 7 6-7" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      ov.appendChild(arr);
    }

    document.body.appendChild(ov);
    requestAnimationFrame(function(){ov.style.opacity='1';});
    document.getElementById('_pwa-later').onclick=dismiss;
    if(type==='android'){
      document.getElementById('_pwa-install').onclick=function(){
        if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){dismiss();});}
        else dismiss();
      };
    }
  }

  if(isIOS){
    window.addEventListener('load',function(){setTimeout(function(){showOverlay('ios');},800);});
  }else if(isAndroid){
    window.addEventListener('beforeinstallprompt',function(e){
      e.preventDefault();deferredPrompt=e;
      setTimeout(function(){showOverlay('android');},800);
    });
  }
})();

/* ── Pull-to-refresh ── */
(function() {
  var pill, icon, wrap;
  var startY = 0, startX = 0, lastY = 0;
  var active = false, busy = false;
  var THRESH = 62;
  var MAX    = 115;
  var HOLD   = 62;

  function init() {
    pill = document.getElementById('ptr-pill');
    icon = document.getElementById('ptr-icon');
    wrap = document.getElementById('page-wrap');
    document.addEventListener('touchstart', ts, { passive: true });
    document.addEventListener('touchmove',  tm, { passive: false });
    document.addEventListener('touchend',   te, { passive: true });
    document.addEventListener('touchcancel', tc, { passive: true });
  }

  function overlayOpen() {
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var id = kids[i].id;
      if (id === 'ptr-pill' || id === 'page-wrap') continue;
      if (parseInt(window.getComputedStyle(kids[i]).zIndex) >= 10000) return true;
    }
    return false;
  }

  function ts(e) {
    if (busy) return;
    startY = lastY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    active = false;
  }

  function tm(e) {
    if (busy) return;
    var t  = e.touches[0];
    var dy = t.clientY - startY;
    var dx = Math.abs(t.clientX - startX);
    lastY  = t.clientY;

    if (!active) {
      if (window.scrollY > 10 || dy < 10 || dx > dy * 0.65 || overlayOpen()) return;
      active = true;
    }
    e.preventDefault();

    var v    = MAX * (1 - Math.exp(-dy / (MAX * 1.05)));
    var prog = Math.min(v / THRESH, 1);

    wrap.style.transition = 'none';
    wrap.style.transform  = 'translateY(' + v + 'px)';

    icon.style.transform = 'rotate(' + (prog * 180) + 'deg)';
    icon.style.color     = v >= THRESH ? 'var(--text)' : 'var(--muted)';
  }

  function te() {
    if (!active || busy) { active = false; return; }
    active = false;
    var dy = lastY - startY;
    var v  = MAX * (1 - Math.exp(-dy / (MAX * 1.6)));
    if (v >= THRESH) go(); else snap();
  }

  function tc() { active = false; if (!busy) snap(); }

  function snap() {
    wrap.style.transition = 'transform 0.42s cubic-bezier(0.25,1,0.5,1)';
    wrap.style.transform  = 'translateY(0)';
    icon.style.transform  = '';
    icon.style.color      = 'var(--muted)';
  }

  function go() {
    busy = true;
    wrap.style.transition = 'transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
    wrap.style.transform  = 'translateY(' + HOLD + 'px)';
    icon.style.transform  = '';
    icon.style.color      = 'var(--text)';
    icon.className        = 'ptr-spin';

    doRender().then(done).catch(function() { busy = false; snap(); });
  }

  function done() {
    icon.className   = '';
    icon.textContent = '✓';
    icon.style.color = '#22c55e';
    setTimeout(function() {
      wrap.style.transition = 'transform 0.58s cubic-bezier(0.25,1,0.5,1)';
      wrap.style.transform  = 'translateY(0)';
      setTimeout(function() {
        icon.textContent = '↻';
        icon.style.color = 'var(--muted)';
        busy = false;
      }, 600);
    }, 850);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
