<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--border:rgba(255,255,255,0.08);--text:#f0f4ff;--muted:#6b7a99;--green:#10b981;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;}
#page-wrap{padding:24px 16px 48px;background:var(--bg);position:relative;z-index:1;will-change:transform;min-height:100vh;}
.header{text-align:center;margin-bottom:24px;}
.eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,6vw,52px);font-weight:900;text-transform:uppercase;letter-spacing:2px;background:linear-gradient(135deg,#fff,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.sub{font-size:12px;color:var(--muted);margin-top:6px;}
.btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:'Barlow',sans-serif;font-size:11px;padding:5px 16px;border-radius:20px;cursor:pointer;margin:4px;transition:all 0.2s;}
.btn:hover{color:var(--text);}
.btn-primary{background:#3b82f6;border-color:#3b82f6;color:white;}
.btn-primary:hover{background:#2563eb;color:white;}
.btn-green{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.3);color:#10b981;}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.25);color:#f87171;font-size:10px;padding:3px 10px;}

/* Pool switcher */
.pool-switcher{max-width:640px;margin:0 auto 20px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pool-switcher-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
.pool-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;flex:1;outline:none;min-width:140px;}
.pool-select option{background:#1a2236;}

/* Pool list screen */
.pool-list-screen{max-width:640px;margin:0 auto;}
.pool-list-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center;}
.pool-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color 0.2s;}
.pool-item:hover{border-color:rgba(255,255,255,0.2);}
.pool-item.active{border-color:#3b82f6;}
.pool-item-rank{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;flex-shrink:0;line-height:1;text-align:center;}
.pool-item-rank .rank-num{font-size:26px;color:var(--text);}
.pool-item-rank .rank-ord{font-size:12px;color:var(--muted);vertical-align:super;}
.pool-item-rank .rank-odds{font-size:10px;color:var(--muted);font-weight:400;margin-top:4px;white-space:nowrap;}
.pool-item-rank .rank-odds span{color:var(--text);font-weight:700;}
.pool-item-info{flex:1;min-width:0;}
.pool-item-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;line-height:1.15;word-break:break-word;}
.pool-item-standing{font-size:11px;color:var(--muted);margin-top:3px;}
.pool-item-standing span{color:var(--text);font-weight:600;}
.pool-item-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.btn-pool-action{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:'Barlow',sans-serif;font-size:10px;padding:4px 10px;border-radius:16px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-pool-action.active{background:rgba(59,130,246,0.15);border-color:#3b82f6;color:#60a5fa;}
.btn-pool-action:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
.btn-pool-del{background:none;border:1px solid transparent;color:rgba(255,255,255,0.2);font-size:13px;padding:3px 6px;border-radius:8px;cursor:pointer;transition:all 0.2s;line-height:1;flex-shrink:0;}
.btn-pool-del:hover{border-color:rgba(239,68,68,0.3);color:#f87171;background:rgba(239,68,68,0.08);}

/* Setup */
.setup-screen{max-width:640px;margin:0 auto;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.title-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.title-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;width:100%;outline:none;text-transform:uppercase;letter-spacing:1px;}
.player-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.player-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pabbrev{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;width:58px;outline:none;text-transform:uppercase;}
.pname{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;flex:1;min-width:120px;outline:none;}
.pcount{font-size:11px;color:var(--muted);flex-shrink:0;}
.teams-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.tbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--muted);transition:all 0.15s;user-select:none;}
.tbtn.taken{opacity:0.2;pointer-events:none;}
.setup-actions{text-align:center;margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.add-wrap{text-align:center;margin-bottom:12px;}

/* Bracket */
.legend{display:flex;justify-content:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;}
.ldot{width:8px;height:8px;border-radius:50%;}
.round-section{max-width:1120px;margin:0 auto 8px;}
.rtitle{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.clabels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.clabel{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;}
.four-col{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.one-col{max-width:500px;margin:0 auto;}
.series{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.series.live-series{border-color:#f87171;box-shadow:0 0 0 1px #f8717133;}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f87171;margin-right:4px;animation:pulse-dot 1.2s ease-in-out infinite;vertical-align:middle;flex-shrink:0;}
.team-odds-row.my-team{border-left:3px solid;background:rgba(255,255,255,0.03);}
.sh{padding:5px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;}
.tr{display:flex;align-items:center;gap:8px;padding:8px 12px;}
.tr+.tr,.tbd-r+.tr{border-top:1px solid var(--border);}
.pool-pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:6px}
.pill{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:34px;text-align:center;flex-shrink:0;}
.pill-empty{min-width:34px;flex-shrink:0;display:inline-block;}
.tname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;flex:1;text-transform:uppercase;}.tlogo{width:20px;height:20px;object-fit:contain;flex-shrink:0;}
.odds-wrap{display:flex;align-items:center;justify-content:flex-end;flex-shrink:0;width:50px;gap:2px;}
.todds{font-size:10px;color:var(--green);font-weight:500;}
.twins{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;width:18px;text-align:right;color:var(--muted);flex-shrink:0;}
.twins.lead{color:var(--green);}
.tname.elim{opacity:0.3;text-decoration:line-through;}
.tname.champ{color:#fbbf24;}
.tr.series-winner{background:rgba(74,222,128,0.07);border-left:3px solid #4ade80;}
.tr.series-elim{background:rgba(0,0,0,0.25);opacity:0.4;}
.odds-delta{font-size:7px;font-weight:700;flex-shrink:0;line-height:1;}
.odds-delta.up{color:#4ade80;}
.odds-delta.down{color:#f87171;}
.round-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;border-top:1px solid var(--border);padding:10px 4px;margin-bottom:8px;}
.round-toggle{font-size:10px;color:var(--muted);transition:transform 0.2s;display:inline-block;}
.round-section.is-collapsed .round-toggle{transform:rotate(-90deg);}
.round-body.collapsed{display:none;}
.team-odds-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.series{cursor:pointer;transition:opacity 0.2s;}
.series-dimmed{opacity:0.35;}
.expand-all-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:2px 6px;}
.series-games{border-top:1px solid var(--border);padding:6px 10px;display:none;}
.series-games.open{display:block;}
.game-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-family:'Barlow Condensed',sans-serif;font-size:11px;}
.game-num{font-weight:700;color:var(--muted);min-width:20px;font-size:10px;}
.game-date-col{color:var(--muted);min-width:40px;font-size:10px;}
.game-result{flex:1;}
.game-result.live{color:#f87171;font-weight:700;}
.game-result.final{color:var(--green);}
.game-result.future{color:var(--muted);}
.team-odds-row{display:flex;flex-direction:column;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;overflow:hidden;}
.tor-main{display:flex;align-items:center;gap:6px;padding:5px 8px;}
.team-rank{font-size:9px;color:var(--muted);width:14px;text-align:right;flex-shrink:0;}
.tlogo-sm{width:16px;height:16px;object-fit:contain;flex-shrink:0;}
.team-name-odds{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;flex:1;}
.team-cup-pct{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--green);}
.team-detail{display:none;border-top:1px solid var(--border);padding:6px 8px 8px;}
.team-detail.open{display:block;}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.detail-cell{display:flex;flex-direction:column;align-items:center;padding:4px 2px;background:var(--surface);border-radius:5px;}
.detail-label{font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:1px;white-space:nowrap;}
.detail-val{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--green);}
.series-odds-header{display:flex;align-items:center;gap:4px;padding:5px 10px;font-size:9px;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:0.5px;text-transform:uppercase;}
.soh-team{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text);}
.soh-pct{color:var(--green);font-weight:600;}

  .game-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
  .game-badge.live { color: #f87171; }
  .game-badge.final { color: var(--green); }

.tbd-r{padding:9px 12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);}
.standings{max-width:1120px;margin:24px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.stitle{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.scard{background:var(--surface2);border-radius:12px;padding:16px 12px;text-align:center;border:1px solid var(--border);position:relative;overflow:hidden;}
.scard.first::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#fbbf24,transparent);}
.streak-badge{position:absolute;top:6px;left:6px;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:2px 5px;border-radius:4px;border:1px solid;line-height:1.2;}
.srank{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.sname{font-size:12px;color:var(--muted);margin:4px 0 6px;}
.spct{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;line-height:1;}
.steams{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.7;}
.loading{text-align:center;padding:40px;color:var(--muted);}
@media(max-width:640px){.four-col{grid-template-columns:1fr 1fr;}.sgrid{grid-template-columns:repeat(2,1fr);}.tname{font-size:14px;}.spct{font-size:28px;}.tr{gap:4px;padding:8px 12px;}.odds-wrap{width:54px;}.tlogo{width:16px;height:16px;}.pill{min-width:28px;padding:2px 4px;font-size:9px;}.pill-empty{min-width:28px;}}

.team-odds-row.eliminated { opacity: 0.35; }
.team-odds-row.eliminated .team-name-odds { text-decoration: line-through; }
.ptc-bar-row { display:flex; align-items:center; gap:5px; }
.ptc-bar-track { flex:1; background:rgba(255,255,255,0.07); border-radius:2px; height:3px; }
.ptc-bar-fill { height:100%; border-radius:2px; opacity:0.75; }
.ptc-label { font-size:9px; color:var(--muted); font-family:Inter,sans-serif; flex-shrink:0; }
#share-overlay { position:fixed; inset:0; z-index:10000; background:#0d1117; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 14px; box-sizing:border-box; }
.share-section-label { font-size:9px; font-weight:700; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin:12px 0 6px; font-family:Inter,sans-serif; }
.share-series-row { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.share-series-team { flex:1; display:flex; align-items:center; gap:4px; }
.share-series-score { font-size:14px; font-weight:900; color:#f9fafb; font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; flex-shrink:0; min-width:28px; text-align:center; }
.share-btn { background:rgba(255,255,255,0.08); border:none; color:var(--muted); font-size:11px; padding:4px 10px; border-radius:6px; cursor:pointer; font-family:Inter,sans-serif; vertical-align:middle; }

.pdot { cursor:pointer; transition:transform 0.15s; flex-shrink:0; }
.pdot:active { transform:scale(0.88); }
.color-palette { display:flex; flex-wrap:wrap; gap:6px; padding:8px 0 4px 0; }
.cswatch { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform 0.12s, border-color 0.12s; flex-shrink:0; }
.cswatch:active { transform:scale(0.85); }
.cswatch.selected { border-color:#fff; }

/* ── Width-constrained containers ── */
#tonight-wrap { max-width:1120px; margin:0 auto; }

/* ── Bracket View ─────────────────────────────── */
/* Tuned for iPhone 14/16 Pro (~393px viewport) */
#bracket-section { margin:0 auto; padding:0 4px; }
.bracket-wrap { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:8px 6px 10px; max-width:460px; margin:0 auto; }
@media (min-width:641px) {
  .bracket-wrap { max-width:900px; padding:12px 10px 14px; }
  .bc-r1-col { width:auto !important; flex:1 !important; }
  .bc-r2-col { width:120px !important; }
  .bc-card-sm .bc-name { display:block; }
  .bc-card-sm .bc-wins { display:block; }
  .bc-card-sm .bc-logo { width:28px; height:28px; }
  .bc-card-sm .bc-team { padding:9px 8px 9px 6px; justify-content:flex-start; gap:4px; }
  .bc-card-sm .bc-pill { display:inline-flex; }
}
.bracket-conf-labels { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; padding:0 2px; }
.bracket-conf-label { font-family:'Barlow Condensed',sans-serif; font-size:8px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.bracket-half { display:flex; align-items:center; margin-bottom:0; }
.bc-half-group { display:flex; gap:3px; flex:1; align-items:center; }
.bc-center-gap { width:4px; flex-shrink:0; }
.bc-r1-col { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
.bc-r2-col { width:56px; flex-shrink:0; display:flex; flex-direction:column; align-items:stretch; }
.bracket-middle { display:flex; align-items:center; margin:2px 0 1px; }
.bc-cf-col { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.bc-scf-col { width:60px; flex-shrink:0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; }
.bc-card { background:var(--surface2); border:1px solid var(--border); border-radius:8px; overflow:hidden; cursor:pointer; }
.bc-card.bc-live { border-color:#f87171; box-shadow:0 0 0 1px #f8717133; }
.bc-card.bc-card-lg { border-radius:10px; }
.bc-games-wrap { display:none; border-top:1px solid var(--border); padding:4px 3px 3px; }
.bc-card.bc-open .bc-games-wrap { display:block; }
.bc-pill { display:inline-flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:700; padding:1px 5px; border-radius:6px; letter-spacing:0.2px; flex-shrink:0; line-height:1; }
.bc-team { display:flex; align-items:center; gap:4px; padding:9px 8px 9px 6px; border-left:2px solid transparent; }
.bc-logo { width:28px; height:28px; object-fit:contain; flex-shrink:0; }
.bc-name { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; }
.bc-wins { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:900; color:var(--muted); margin-left:auto; padding-right:4px; }
.bc-lead { color:var(--green); }
.bc-elim { opacity:0.3; text-decoration:line-through; }
.bc-tbd .bc-name { color:var(--muted); font-weight:400; }
.bc-tbd .bc-wins { opacity:0.3; }
.bc-round-label { font-family:'Barlow Condensed',sans-serif; font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); text-align:center; padding:2px 0 1px; }
.bc-trophy img { width:50px; height:auto; display:block; margin:0 auto 2px; }
.bc-scf-label { font-family:'Barlow Condensed',sans-serif; font-size:7px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.3; }
.bc-card-sm .bc-name { display:none; }
.bc-card-sm .bc-wins { display:none; }
.bc-card-sm .bc-logo { width:30px; height:30px; }
.bc-card-sm .bc-team { padding:5px 6px; justify-content:center; gap:2px; }
.bc-team + .bc-team { border-top:1px solid var(--border); }
.bc-card-sm .bc-pill { display:none; }
.bc-sm-score { font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:700; color:var(--muted); text-align:center; padding:2px 0 3px; border-top:1px solid var(--border); line-height:1; }
.bc-team.bc-loser { opacity:0.18; }
.bc-team.bc-winner { background:rgba(74,222,128,0.08); border-left-color:#4ade80 !important; }
.bc-gr { display:flex; align-items:baseline; gap:2px; font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--muted); padding:1px 0; line-height:1.3; }
.bc-gr .bc-gn { font-size:9px; font-weight:700; flex-shrink:0; min-width:14px; }
.bc-gr .bc-win { color:#d1d5db; font-weight:700; }
.bc-gr-live { color:#f87171; }

  /* Pull-to-refresh */
  #ptr-pill { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 0; pointer-events: none; -webkit-user-select: none; user-select: none; }
  #ptr-icon { font-size: 22px; display: inline-block; color: var(--muted); will-change: transform; transition: transform 0.1s ease; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
  #ptr-icon.ptr-spin { animation: ptr-spin 0.65s linear infinite; transition: none; }
</style>
</head>
<body>

<div id="ptr-pill"><span id="ptr-icon">↻</span></div>

<div id="page-wrap">
<div class="header">
  <div class="eyebrow">2026 NHL Postseason</div>
  <h1 id="pool-title">Playoff Pool</h1>
  <div class="sub" id="sub">Loading...</div>
  <div style="margin-top:8px;display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;" id="header-btns">
    <button class="btn" style="margin:0;padding:5px 10px" onclick="doRefresh()">↻ Refresh</button>
    <button class="btn" style="margin:0;padding:5px 10px" onclick="showSetup()">⚙ Edit Pool</button>
    <button class="btn" style="margin:0;padding:5px 10px" onclick="showPoolList()">☰ My Pools</button>
    <button class="btn" style="margin:0;padding:5px 10px" onclick="toggleBracket()">🏒 Bracket</button>
  </div>
</div>

<div id="pool-switcher-wrap"></div>
<div id="setup" style="display:none"></div>
<div id="pool-list" style="display:none"></div>
<div id="legwrap"></div>
<div id="pie-wrap"></div>
<div id="bracket-section" style="display:none;margin-top:16px;margin-bottom:16px"></div>
<div id="tonight-wrap"></div>
<div id="main"><div class="loading">Loading...</div></div>
<div id="swrap"></div>
</div>

<script>
var ODDS_API = "https://script.google.com/macros/s/AKfycbyeMYsFI6sVfRnuPJgX_6-Ev9qr7dosfnpD-T-s9UtmMoQ03fjfHy6wuY3AJ63wU2wY/exec";
var NHL_WORKER = "https://lucky-forest-af32.gamache-m.workers.dev";
var ALL_COLORS = [
  {color:"#3b82f6",bg:"rgba(59,130,246,0.15)"},
  {color:"#10b981",bg:"rgba(16,185,129,0.15)"},
  {color:"#f59e0b",bg:"rgba(245,158,11,0.15)"},
  {color:"#a855f7",bg:"rgba(168,85,247,0.15)"},
  {color:"#ec4899",bg:"rgba(236,72,153,0.15)"},
  {color:"#06b6d4",bg:"rgba(6,182,212,0.15)"},
  {color:"#f97316",bg:"rgba(249,115,22,0.15)"},
  {color:"#84cc16",bg:"rgba(132,204,22,0.15)"}
];
var PALETTE = [
  "#3b82f6","#10b981","#f59e0b","#a855f7",
  "#ec4899","#06b6d4","#f97316","#84cc16",
  "#ef4444","#14b8a6","#8b5cf6","#f43f5e"
];
function hexToRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}
function getPC(pool,idx){var def=ALL_COLORS[idx%ALL_COLORS.length];if(!pool||!pool.players||!pool.players[idx]||!pool.players[idx].color)return def;var c=pool.players[idx].color;return{color:c,bg:hexToRgba(c,0.15)};}
var ALL_TEAMS = ["COL","EDM","TBL","LAK","BUF","MTL","PIT","ANA","MIN","OTT","PHI","UTA","CAR","VGK","DAL","BOS"];

// My player — localStorage personalization per pool
var _makerState = {};
var _detailStateMaker = null;
var _lgoReplayDataM = null;
var _playerCards = {};
var _leadersCache = {};
var _leadersTabActive = 'points';
var _lgoPhysicalsCache = null;
function _myPlayerKey(){var p=getActivePool();return p?'myPlayer_'+(p.id||p.title):null;}
function getMyPlayer(){try{var k=_myPlayerKey();return k?localStorage.getItem(k):null;}catch(e){return null;}}
function setMyPlayer(abbrev){
  try{var k=_myPlayerKey();if(!k)return;
    if(abbrev===getMyPlayer())localStorage.removeItem(k);else localStorage.setItem(k,abbrev);
  }catch(e){}
  _rebuildMakerUI();
}
function _rebuildMakerUI(){
  var st=_makerState;
  if(!st.pieTotals)return;
  document.getElementById('legwrap').innerHTML=_buildMakerLegendPie(st.pieTotals,st.pieSvg);
  document.getElementById('tonight-wrap').innerHTML=buildOnTheClock(st.gamesData||[],st.odds);
  document.getElementById('swrap').innerHTML=buildStandings(st.odds,st.historyData)+buildTeamOdds(st.odds,st.roundOdds,st.historyData,st.elimRound)+'<div id="all-leaders-wrap">'+buildScoringLeaders(st.leaders,st.odds)+buildGoalieLeaders(st.goalies,st.odds)+buildEdgeButton()+'</div>';
}
function _buildMakerLegendPie(pieTotals,pieSvg){
  var me=getMyPlayer();
  var myData=me?pieTotals.find(function(p){return(p.abbrev||'').toUpperCase()===me.toUpperCase();}):null;
  var myRank=me?pieTotals.findIndex(function(p){return(p.abbrev||'').toUpperCase()===me.toUpperCase();})+1:-1;
  var standingBlock='';
  if(myData&&myRank>0){
    var rl=["1st","2nd","3rd","4th"][myRank-1]||(myRank+'th');
    var pc=getPC(getActivePool(),myData.ci);
    standingBlock='<div onclick="setMyPlayer(\''+esc(me)+'\')" style="text-align:center;padding:6px 10px;background:var(--surface);border:1.5px solid '+pc.color+';border-radius:12px;cursor:pointer;flex-shrink:0">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:42px;font-weight:900;line-height:1;color:'+pc.color+'">'+rl+'</div>'
      +'<span class="pill" style="background:'+pc.bg+';color:'+pc.color+';margin-top:3px;display:inline-block">'+esc(me)+'</span>'
      +'<div style="font-size:9px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-top:2px">'+myData.total.toFixed(1)+'%</div>'
      +'</div>';
  }
  var pool=getActivePool();
  var items=(pool?pool.players:[]).map(function(p,i){var pc=getPC(pool,i);
    var abbrev=(p.abbrev||p.name.substring(0,3)).toUpperCase();
    var pt=pieTotals?pieTotals.find(function(x){return(x.abbrev||'').toUpperCase()===abbrev;}):null;
    var isElim=pt&&pt.total<0.1;
    return '<div class="legend-item"'+(isElim?' style="opacity:0.4"':'')+'>'+
      '<div class="ldot" style="background:'+pc.color+'"></div>'+
      '<span style="font-weight:700;color:var(--text);'+(isElim?'text-decoration:line-through':'')+'">'+abbrev+'</span>'+
      '<span style="color:var(--muted);font-size:11px;'+(isElim?'text-decoration:line-through':'')+'"> — '+esc(p.name)+'</span>'+
      '</div>';
  }).join('');
  if(!pieSvg)return'<div class="legend">'+items+'</div>';
  return'<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;">'
    +standingBlock
    +'<div style="display:flex;align-items:center;gap:10px;">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;">'+items+'</div>'
    +pieSvg+'</div></div>';
}
var R1W = [{t:"COL",b:"LAK"},{t:"DAL",b:"MIN"},{t:"VGK",b:"UTA"},{t:"EDM",b:"ANA"}];
var R1E = [{t:"BUF",b:"BOS"},{t:"TBL",b:"MTL"},{t:"CAR",b:"OTT"},{t:"PIT",b:"PHI"}];
// Hard-coded elimination order for R1/R2 (higher = more recently eliminated = sorts first among eliminated)
var ELIM_ORDER = {OTT:1,LAK:2,PIT:3,DAL:4,EDM:5,BOS:6,UTA:7,TBL:8,PHI:9,MIN:10};

var setupPlayers = [];
var setupTitle = "Playoff Pool";
var editingPoolId = null;

// ---- Storage ----
function getAllPools() {
  try { var s = localStorage.getItem("pp2026_pools"); return s ? JSON.parse(s) : {}; } catch(e) { return {}; }
}
function savePools(pools) {
  try { localStorage.setItem("pp2026_pools", JSON.stringify(pools)); } catch(e) {}
}
function getActiveId() {
  try { return localStorage.getItem("pp2026_active") || null; } catch(e) { return null; }
}
function setActiveId(id) {
  try { localStorage.setItem("pp2026_active", id); } catch(e) {}
}
function getActivePool() {
  var pools = getAllPools();
  var id = getActiveId();
  return (id && pools[id]) ? pools[id] : null;
}
function generateId() {
  return "pool_" + Date.now();
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---- Pool List Screen ----
function showPoolList() {
  showSection("pool-list");
  drawPoolList();
}

function drawPoolList() {
  var pools = getAllPools();
  var activeId = getActiveId();
  var ids = Object.keys(pools);
  var el = document.getElementById("pool-list");
  el.innerHTML = "";

  var wrap = document.createElement("div");
  wrap.className = "pool-list-screen";

  var title = document.createElement("div");
  title.className = "pool-list-title";
  title.textContent = "My Pools";
  wrap.appendChild(title);

  if (ids.length === 0) {
    var empty = document.createElement("div");
    empty.className = "loading";
    empty.textContent = "No pools yet — create one below!";
    wrap.appendChild(empty);
  }

  ids.forEach(function(id) {
    var pool = pools[id];
    var isActive = id === activeId;
    var item = document.createElement("div");
    item.className = "pool-item" + (isActive ? " active" : "");

    // Standing data — use cached _standings if available
    var myKey = 'myPlayer_' + (pool.id || pool.title);
    var myAbbrev = null;
    try { myAbbrev = localStorage.getItem(myKey); } catch(e) {}
    var standings = pool._standings || [];
    var me = (myAbbrev && standings.length) ? standings.find(function(s){ return (s.abbrev||'').toUpperCase() === myAbbrev.toUpperCase(); }) : null;

    // Info block (name — wraps naturally)
    var info = document.createElement("div");
    info.className = "pool-item-info";
    var nameEl = document.createElement("div");
    nameEl.className = "pool-item-name";
    nameEl.textContent = pool.title || "Untitled Pool";
    info.appendChild(nameEl);
    item.appendChild(info);

    // Rank block (right of title) — ordinal + cup% stacked
    if (me) {
      var rankEl = document.createElement("div");
      rankEl.className = "pool-item-rank";
      var ords = ['ST','ND','RD'];
      var ord = ords[me.rank-1] || 'TH';
      var rankColor = ['#fbbf24','#9ca3af','#cd7f32'][me.rank-1] || '#f87171';
      rankEl.innerHTML = '<div><span class="rank-num" style="color:' + rankColor + '">' + me.rank + '</span><span class="rank-ord" style="color:' + rankColor + ';opacity:0.8">' + ord + '</span></div>'
        + '<div class="rank-odds">' + (me.delta > 0.05 ? '<span style="color:#4ade80">↑</span> ' : me.delta < -0.05 ? '<span style="color:#f87171">↓</span> ' : '') + '<span>' + me.total.toFixed(1) + '%</span> cup</div>';
      item.appendChild(rankEl);
    }

    var actions = document.createElement("div");
    actions.className = "pool-item-actions";

    var selectBtn = document.createElement("button");
    selectBtn.className = "btn-pool-action" + (isActive ? " active" : "");
    selectBtn.textContent = isActive ? "Active" : "Switch";
    (function(pid) {
      selectBtn.onclick = function(e) {
        e.stopPropagation();
        setActiveId(pid);
        showSection("main");
        doRender();
        drawPoolSwitcher();
      };
    })(id);
    actions.appendChild(selectBtn);

    var editBtn = document.createElement("button");
    editBtn.className = "btn-pool-action";
    editBtn.textContent = "Edit";
    (function(pid) {
      editBtn.onclick = function(e) {
        e.stopPropagation();
        startEditPool(pid);
      };
    })(id);
    actions.appendChild(editBtn);

    var delBtn = document.createElement("button");
    delBtn.className = "btn-pool-del";
    delBtn.innerHTML = "&#x2715;";
    delBtn.title = "Delete pool";
    (function(pid) {
      delBtn.onclick = function(e) {
        e.stopPropagation();
        if (!confirm("Delete this pool?")) return;
        var p = getAllPools();
        delete p[pid];
        savePools(p);
        if (getActiveId() === pid) {
          var remaining = Object.keys(p);
          setActiveId(remaining.length > 0 ? remaining[0] : null);
        }
        drawPoolList();
        drawPoolSwitcher();
      };
    })(id);
    actions.appendChild(delBtn);

    item.appendChild(actions);
    wrap.appendChild(item);
  });

  // New pool button
  var newWrap = document.createElement("div");
  newWrap.style.textAlign = "center";
  newWrap.style.marginTop = "16px";
  var newBtn = document.createElement("button");
  newBtn.className = "btn btn-green";
  newBtn.textContent = "+ New Pool";
  newBtn.onclick = function() { startNewPool(); };
  newWrap.appendChild(newBtn);

  if (getActiveId()) {
    var backBtn = document.createElement("button");
    backBtn.className = "btn";
    backBtn.textContent = "← Back";
    backBtn.onclick = function() { showSection("main"); doRender(); };
    newWrap.appendChild(backBtn);
  }

  wrap.appendChild(newWrap);

  var tourWrap = document.createElement("div");
  tourWrap.style.cssText = "text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.07)";
  var tourBtn = document.createElement("button");
  tourBtn.className = "btn";
  tourBtn.textContent = "? Take the tour";
  tourBtn.style.cssText = "opacity:0.5;font-size:11px";
  tourBtn.onclick = function() {
    if (getActiveId()) { showSection("main"); doRender(); setTimeout(startTour, 1200); }
    else startTour();
  };
  tourWrap.appendChild(tourBtn);
  wrap.appendChild(tourWrap);

  el.appendChild(wrap);
}

function drawPoolSwitcher() {
  var pools = getAllPools();
  var ids = Object.keys(pools);
  var wrap = document.getElementById("pool-switcher-wrap");
  if (ids.length <= 1) { wrap.innerHTML = ""; return; }
  var activeId = getActiveId();
  var html = '<div class="pool-switcher"><span class="pool-switcher-label">Pool</span><select class="pool-select" onchange="switchPool(this.value)">';
  ids.forEach(function(id) {
    html += '<option value="' + esc(id) + '"' + (id === activeId ? " selected" : "") + '>' + esc(pools[id].title || "Untitled") + '</option>';
  });
  html += '</select><button class="btn btn-green" onclick="startNewPool()" style="margin:0;padding:4px 12px;font-size:10px">+ New</button></div>';
  wrap.innerHTML = html;
}

function switchPool(id) {
  setActiveId(id);
  var pool = getActivePool();
  if (pool) document.getElementById("pool-title").textContent = pool.title || "Playoff Pool";
  doRender();
}

// ---- Setup / Edit ----
function autoAbbrev(name) {
  var words = name.trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "";
  var initials = words.map(function(w){ return w[0].toUpperCase(); }).join("");
  if (initials.length >= 3) return initials.substring(0,3);
  // pad with next chars from first word
  var extra = words[0].toUpperCase().substring(1);
  return (initials + extra).substring(0,3);
}

function startNewPool() {
  editingPoolId = null;
  setupTitle = "Playoff Pool";
  setupPlayers = [
    {name:"Player 1",abbrev:"P1",teams:[],abbrevDirty:false},
    {name:"Player 2",abbrev:"P2",teams:[],abbrevDirty:false},
    {name:"Player 3",abbrev:"P3",teams:[],abbrevDirty:false},
    {name:"Player 4",abbrev:"P4",teams:[],abbrevDirty:false}
  ];
  showSection("setup");
  drawSetup();
}

function startEditPool(id) {
  var pools = getAllPools();
  var pool = pools[id];
  if (!pool) return;
  editingPoolId = id;
  setupTitle = pool.title || "Playoff Pool";
  setupPlayers = pool.players.map(function(p) {
    return {name:p.name, abbrev:p.abbrev||p.name.substring(0,3).toUpperCase(), teams:p.teams.slice(), color:p.color||null, abbrevDirty:true};
  });
  showSection("setup");
  drawSetup();
}

function showSetup() {
  var active = getActivePool();
  if (active) {
    startEditPool(getActiveId());
  } else {
    startNewPool();
  }
}

function readCurrentNames() {
  var titleEl = document.getElementById("setup-title");
  if (titleEl) setupTitle = titleEl.value || "Playoff Pool";
  setupPlayers.forEach(function(p, i) {
    var aEl = document.getElementById("pa"+i);
    var nEl = document.getElementById("pn"+i);
    if (nEl) p.name = nEl.value || ("Player "+(i+1));
    if (aEl) {
      if (p.abbrevDirty) {
        p.abbrev = aEl.value.toUpperCase().substring(0,3) || autoAbbrev(p.name) || p.name.substring(0,3).toUpperCase();
      } else {
        var gen = autoAbbrev(p.name);
        p.abbrev = gen || p.name.substring(0,3).toUpperCase();
        aEl.value = p.abbrev;
      }
    }
  });
}

function drawSetup() {
  var taken = {};
  setupPlayers.forEach(function(p,i){p.teams.forEach(function(t){taken[t]=i;});});
  var out = document.getElementById("setup");
  out.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "setup-screen";

  // Title
  var titleWrap = document.createElement("div");
  titleWrap.className = "title-wrap";
  var tl = document.createElement("div");
  tl.className = "slabel";
  tl.style.marginBottom = "8px";
  tl.textContent = "Pool name";
  titleWrap.appendChild(tl);
  var ti = document.createElement("input");
  ti.className = "title-input";
  ti.id = "setup-title";
  ti.value = setupTitle;
  ti.placeholder = "PLAYOFF POOL";
  ti.maxLength = 30;
  titleWrap.appendChild(ti);
  wrap.appendChild(titleWrap);

  var pl = document.createElement("div");
  pl.className = "slabel";
  pl.textContent = "Players & teams";
  wrap.appendChild(pl);

  setupPlayers.forEach(function(p,i) {
    var pc = setupPlayers[i].color ? {color:setupPlayers[i].color, bg:hexToRgba(setupPlayers[i].color,0.15)} : ALL_COLORS[i%ALL_COLORS.length];
    var block = document.createElement("div");
    block.className = "player-block";
    var head = document.createElement("div");
    head.className = "player-head";
    var dot = document.createElement("div");
    dot.className = "pdot";
    dot.style.background = pc.color;
    dot.style.width = "18px";
    dot.style.height = "18px";
    dot.style.borderRadius = "50%";
    dot.title = "Change colour";
    (function(pi, dotEl, blockEl) {
      dotEl.onclick = function() {
        var existing = blockEl.querySelector('.color-palette');
        if (existing) { existing.remove(); return; }
        var pal = document.createElement('div');
        pal.className = 'color-palette';
        PALETTE.forEach(function(hex) {
          var sw = document.createElement('div');
          sw.className = 'cswatch' + (hex === (setupPlayers[pi].color || PALETTE[pi % PALETTE.length]) ? ' selected' : '');
          sw.style.background = hex;
          sw.onclick = function(e) {
            e.stopPropagation();
            readCurrentNames();
            setupPlayers[pi].color = hex;
            drawSetup();
          };
          pal.appendChild(sw);
        });
        blockEl.insertBefore(pal, blockEl.querySelector('.teams-grid'));
      };
    })(i, dot, block);
    head.appendChild(dot);
    var ai = document.createElement("input");
    ai.className = "pabbrev";
    ai.id = "pa"+i;
    ai.value = p.abbrev||"";
    ai.placeholder = "ABC";
    ai.maxLength = 3;
    (function(pi){ ai.addEventListener("input", function(){ setupPlayers[pi].abbrevDirty = true; readCurrentNames(); }); })(i);
    head.appendChild(ai);
    var ni = document.createElement("input");
    ni.className = "pname";
    ni.id = "pn"+i;
    ni.value = p.name||"";
    ni.placeholder = "Player "+(i+1)+" name";
    ni.addEventListener("input", readCurrentNames);
    head.appendChild(ni);
    var cnt = document.createElement("span");
    cnt.className = "pcount";
    cnt.textContent = p.teams.length+" teams";
    head.appendChild(cnt);
    if (setupPlayers.length > 2) {
      var rb = document.createElement("button");
      rb.className = "btn btn-danger";
      rb.textContent = "✕ Remove";
      (function(idx){rb.onclick=function(){readCurrentNames();setupPlayers.splice(idx,1);drawSetup();};})(i);
      head.appendChild(rb);
    }
    block.appendChild(head);
    var grid = document.createElement("div");
    grid.className = "teams-grid";
    ALL_TEAMS.forEach(function(t){
      var mine = p.teams.indexOf(t)>=0;
      var takenBy = (t in taken)&&taken[t]!==i;
      var btn = document.createElement("div");
      btn.className = "tbtn"+(takenBy?" taken":"");
      btn.textContent = t;
      if (mine){btn.style.background=pc.bg;btn.style.borderColor=pc.color;btn.style.color=pc.color;}
      if (!takenBy){
        (function(pi,team){btn.onclick=function(){readCurrentNames();var ix=setupPlayers[pi].teams.indexOf(team);if(ix>=0)setupPlayers[pi].teams.splice(ix,1);else setupPlayers[pi].teams.push(team);drawSetup();};})(i,t);
      }
      grid.appendChild(btn);
    });
    block.appendChild(grid);
    wrap.appendChild(block);
  });

  if (setupPlayers.length < 8) {
    var aw = document.createElement("div");
    aw.className = "add-wrap";
    var ab = document.createElement("button");
    ab.className = "btn btn-green";
    ab.textContent = "+ Add Player";
    ab.onclick = function(){readCurrentNames();var n=setupPlayers.length+1;setupPlayers.push({name:"Player "+n,abbrev:"P"+n,teams:[]});drawSetup();};
    aw.appendChild(ab);
    wrap.appendChild(aw);
  }

  var acts = document.createElement("div");
  acts.className = "setup-actions";
  var sb = document.createElement("button");
  sb.className = "btn btn-primary";
  sb.textContent = "Save & View Pool";

function buildSparkline(histData,team,liveVal){
  var raw=((histData)||[])
    .filter(function(d){return (d.team||'').toUpperCase()===team.toUpperCase()&&d.cup!=null&&d.cup!=='';})
    .sort(function(a,b){return(a.date||'').localeCompare(b.date||'');})
    .map(function(d){return{date:d.date,val:parseFloat(d.cup)};})
    .filter(function(d){return!isNaN(d.val);});
  if(liveVal!=null){var td=new Date().toISOString().substring(0,10);var ix=raw.findIndex(function(d){return d.date===td;});if(ix>=0)raw[ix].val=liveVal;else raw.push({date:td,val:liveVal});}
  if(raw.length<2)return'';
  // Filter to significant changes (>= 0.8pp), always keep first & last
  var THRESH=0.8;
  var points=[raw[0]];
  for(var i=1;i<raw.length-1;i++){
    if(Math.abs(raw[i].val-points[points.length-1].val)>=THRESH)points.push(raw[i]);
  }
  points.push(raw[raw.length-1]);
  if(points.length<2)return'';
  var W=200,H=38,padX=8,padY=8;
  var vals=points.map(function(p){return p.val;});
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  var range=max-min||0.5;
  var xs=points.map(function(_,i){return padX+(i/(points.length-1))*(W-padX*2);});
  var ys=vals.map(function(v){return padY+(H-padY*2)*(1-(v-min)/range);});
  var trend=vals[vals.length-1]-vals[0];
  var color=trend>0.2?'#4ade80':trend<-0.2?'#f87171':'#9ca3af';
  var poly=xs.map(function(x,i){return x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ');
  var area='M'+xs[0].toFixed(1)+','+H+' '+xs.map(function(x,i){return'L'+x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ')+' L'+xs[xs.length-1].toFixed(1)+','+H+' Z';
  var dots=points.map(function(p,i){return'<circle cx="'+xs[i].toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="'+(i===points.length-1?2.5:1.8)+'" fill="'+color+'"/>';}).join('');
  var dateLabels=points.map(function(p,i){
    var md=(p.date||'').substring(5).replace('-','/');
    var anchor=i===0?'start':i===points.length-1?'end':'middle';
    return'<text x="'+xs[i].toFixed(1)+'" y="'+(H+9)+'" font-size="6.5" fill="#6b7280" text-anchor="'+anchor+'" font-family="monospace">'+md+'</text>';
  }).join('');
  var valLabels=points.map(function(p,i){
    if(i!==0&&i!==points.length-1)return'';
    var anchor=i===0?'start':'end';
    return'<text x="'+xs[i].toFixed(1)+'" y="'+(ys[i]-4).toFixed(1)+'" font-size="6.5" fill="'+color+'" text-anchor="'+anchor+'" font-weight="700" font-family="sans-serif">'+p.val.toFixed(1)+'%</text>';
  }).join('');
  return'<svg width="100%" viewBox="0 0 '+W+' '+(H+14)+'" preserveAspectRatio="none" style="display:block;height:52px;margin-bottom:4px">'
    +'<defs><linearGradient id="sg-'+team+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.25"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#sg-'+team+')"/>'
    +'<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +dots+valLabels+dateLabels+'</svg>';
}
function buildTeamOdds(oddsMap,roundOdds,histData,elimRound){

      +'<span class="team-name-odds">'+x.t+'</span>'

      +'<div class="detail-cell"><span class="detail-label">Conf Final</span><span class="detail-val">'+(ro.r4||'—')+'</span></div>'

  }).join('');
  return'<div class="standings" style="margin-top:16px"><div class="stitle">All teams — Stanley Cup odds</div>'

function buildDualSparkline(histData,t1,t2,roundKey,liveVal1,liveVal2,startDate,endDate){
  function getPoints(team){
    return((histData)||[])
      .filter(function(d){return(d.team||'').toUpperCase()===team.toUpperCase()&&d[roundKey]!=null&&d[roundKey]!=='';})
      .sort(function(a,b){return(a.date||'').localeCompare(b.date||'');})
      .map(function(d){return{date:d.date,val:normPct(d[roundKey])};})
      .filter(function(d){return!isNaN(d.val);});
  }
  var pts1=getPoints(t1),pts2=getPoints(t2);
  if(pts1.length<2&&pts2.length<2)return'';
  var map1={},map2={};
  pts1.forEach(function(p){map1[p.date]=p.val;});
  pts2.forEach(function(p){map2[p.date]=p.val;});
  // Inject today's live values as final point (only if series not yet over)
  var today=new Date().toISOString().substring(0,10);
  if(liveVal1!=null&&!endDate)map1[today]=liveVal1;
  if(liveVal2!=null&&!endDate)map2[today]=liveVal2;
  var dateSet={};
  Object.keys(map1).concat(Object.keys(map2)).forEach(function(d){dateSet[d]=1;});
  var allDates=Object.keys(dateSet).sort();
  if(startDate)allDates=allDates.filter(function(d){return d>=startDate;});
  if(endDate)allDates=allDates.filter(function(d){return d<=endDate;});
  if(allDates.length<2)return'';
  // Filter to dates where either team shifted >= 1pp, always keep first & last
  var THRESH=1.0;
  var kept=[allDates[0]];
  var p1=map1[allDates[0]]!==undefined?map1[allDates[0]]:null;
  var p2=map2[allDates[0]]!==undefined?map2[allDates[0]]:null;
  for(var i=1;i<allDates.length-1;i++){
    var d=allDates[i];
    var v1=map1[d]!==undefined?map1[d]:p1;
    var v2=map2[d]!==undefined?map2[d]:p2;
    var chg=Math.max(p1!==null?Math.abs(v1-p1):0,p2!==null?Math.abs(v2-p2):0);
    if(chg>=THRESH){
      kept.push(d);
      if(map1[d]!==undefined)p1=map1[d];
      if(map2[d]!==undefined)p2=map2[d];
    }
  }
  kept.push(allDates[allDates.length-1]);
  // Deduplicate
  var useDates=[],seen={};
  kept.forEach(function(d){if(!seen[d]){useDates.push(d);seen[d]=1;}});
  var W=200,H=36,padX=8,padY=6;
  var allVals=useDates.reduce(function(acc,d){if(map1[d]!==undefined)acc.push(map1[d]);if(map2[d]!==undefined)acc.push(map2[d]);return acc;},[]);
  var min=Math.min.apply(null,allVals),max=Math.max.apply(null,allVals);
  var range=max-min||1;
  function toCoords(map){
    return useDates.filter(function(d){return map[d]!==undefined;}).map(function(d){
      var di=useDates.indexOf(d);
      var x=padX+(di/(useDates.length-1))*(W-padX*2);
      var y=padY+(H-padY*2)*(1-(map[d]-min)/range);
      return{x:x,y:y,val:map[d]};
    });
  }
  var c1=toCoords(map1),c2=toCoords(map2);
  function polyStr(pts){return pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');}
  var col1='#60a5fa',col2='#fb923c';
  var last1=c1.length?c1[c1.length-1]:null,last2=c2.length?c2[c2.length-1]:null;
  var dateLabels=useDates.map(function(d,i){
    var md=d.substring(5).replace('-','/');
    var x=padX+(i/(useDates.length-1))*(W-padX*2);
    var anchor=i===0?'start':i===useDates.length-1?'end':'middle';
    return'<text x="'+x.toFixed(1)+'" y="'+(H+9)+'" font-size="6.5" fill="#6b7280" text-anchor="'+anchor+'" font-family="monospace">'+md+'</text>';
  }).join('');
  var dots1=c1.map(function(p,i){return'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(i===c1.length-1?2.5:1.8)+'" fill="'+col1+'"/>';}).join('');
  var dots2=c2.map(function(p,i){return'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(i===c2.length-1?2.5:1.8)+'" fill="'+col2+'"/>';}).join('');
  return'<div style="padding:6px 8px 4px;border-bottom:1px solid var(--border)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">'
    +'<span style="font-size:9px;font-weight:700;color:'+col1+';font-family:\'Barlow Condensed\',sans-serif;letter-spacing:0.5px">'+t1+(last1?' <span style="opacity:0.7">'+last1.val.toFixed(1)+'%</span>':'')+'</span>'
    +'<span style="font-size:7px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;opacity:0.5">win series</span>'
    +'<span style="font-size:9px;font-weight:700;color:'+col2+';font-family:\'Barlow Condensed\',sans-serif;letter-spacing:0.5px">'+(last2?'<span style="opacity:0.7">'+last2.val.toFixed(1)+'%</span> ':'')+t2+'</span>'
    +'</div>'
    +'<svg width="100%" viewBox="0 0 '+W+' '+(H+14)+'" preserveAspectRatio="none" style="display:block;height:44px">'
    +(c1.length>=2?'<polyline points="'+polyStr(c1)+'" fill="none" stroke="'+col1+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>':'')
    +(c2.length>=2?'<polyline points="'+polyStr(c2)+'" fill="none" stroke="'+col2+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>':'')
    +dots1+dots2+dateLabels
    +'</svg></div>';
}
function seriesCard(s,label,odds,gd,dm,roundOdds,roundNum,histData){
  if(!s||s.topTeam==="TBD")return '<div class="series"><div class="sh">'+label+'</div><div class="tbd-r">TBD</div><div class="tbd-r" style="border-top:1px solid var(--border)">TBD</div></div>';
  if(s.isPredicted){
    var pt1=s.topTeam==='TBD'?'?':s.topTeam,pt2=s.bottomTeam==='TBD'?'?':s.bottomTeam;
    function predSlotRow(ts,bt){
      var bts=bt?'border-top:1px solid var(--border);':'';
      if(ts==='?')return '<div class="tbd-r" style="'+bts+'"><span style="opacity:0.5">?</span></div>';
      if(ts.indexOf('/')>-1){var ab=ts.split('/'),pa=ab[0],pb=ab[1],oa=(roundOdds&&roundOdds[pa]&&roundOdds[pa].r2)||'',ob=(roundOdds&&roundOdds[pb]&&roundOdds[pb].r2)||'';return '<div class="tbd-r" style="'+bts+'display:flex;align-items:center;justify-content:center;gap:2px"><span style="opacity:0.6;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;font-size:14px">'+pa+'</span>'+(oa?'<span style="opacity:0.4;font-size:10px;margin-left:2px">'+oa+'</span>':'')+'<span style="opacity:0.2;margin:0 6px">/</span><span style="opacity:0.6;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;font-size:14px">'+pb+'</span>'+(ob?'<span style="opacity:0.4;font-size:10px;margin-left:2px">'+ob+'</span>':'')+'</div>';}
      var p=(roundOdds&&roundOdds[ts]&&roundOdds[ts].r2)||'';
      return '<div class="tbd-r" style="'+bts+'justify-content:space-between;padding:0 10px"><span style="opacity:0.6;font-weight:700;font-family:\'Barlow Condensed\',sans-serif;font-size:14px">'+ts+'</span>'+(p?'<span style="opacity:0.4;font-size:10px;font-family:Inter,sans-serif">'+p+'</span>':'')+'</div>';
    }
    return '<div class="series"><div class="sh">'+label+'</div>'+predSlotRow(pt1,false)+predSlotRow(pt2,true)+'</div>';
  }
  var t1=s.topTeam,t2=s.bottomTeam,w1=s.topWins,w2=s.bottomWins,t1won=w1===4,t2won=w2===4;

function parseSeries(arr){
  if(!Array.isArray(arr))return null;
  // NHL API sometimes mislabels future-round series as round=2; use the series letter to infer
  // the correct round (standard format: A-H=R1, I-L=R2, M-N=R3, O=R4)
  function letterRound(letter){
    if(!letter)return null;
    var c=letter.toUpperCase().charCodeAt(0)-65;
    if(c<8)return 1; if(c<12)return 2; if(c<14)return 3; return 4;
  }
  var byTeams={};
  arr.forEach(function(s){
    var t1=(s.topTeam||"").toUpperCase(),t2=(s.bottomTeam||"").toUpperCase();
    var round=letterRound(s.letter)||s.round||1;
    var e={topTeam:t1||"TBD",bottomTeam:t2||"TBD",topWins:s.topWins||0,bottomWins:s.bottomWins||0,round:round};
    if(t1&&t2&&t1!=="TBD"&&t2!=="TBD")byTeams[[t1,t2].sort().join("-")]=e;
  });
  function find(t1,t2){return byTeams[[t1,t2].sort().join("-")]||{topTeam:t1,bottomTeam:t2,topWins:0,bottomWins:0};}
  var r1w=R1W.map(function(m){return find(m.t,m.b);});
  var r1e=R1E.map(function(m){return find(m.t,m.b);});
  var westUpper=new Set(R1W.slice(0,2).reduce(function(a,m){return a.concat([m.t,m.b]);},[]));
  var westLower=new Set(R1W.slice(2,4).reduce(function(a,m){return a.concat([m.t,m.b]);},[]));
  var eastUpper=new Set(R1E.slice(0,2).reduce(function(a,m){return a.concat([m.t,m.b]);},[]));
  var eastLower=new Set(R1E.slice(2,4).reduce(function(a,m){return a.concat([m.t,m.b]);},[]));
  var allWest=new Set(Array.from(westUpper).concat(Array.from(westLower)));
  var allEast=new Set(Array.from(eastUpper).concat(Array.from(eastLower)));
  var r2=[null,null,null,null],r3=[null,null],r4=null;
  arr.forEach(function(s){
    var round=letterRound(s.letter)||s.round||1;
    if(round<2)return;
    var t1=(s.topTeam||"").toUpperCase(),t2=(s.bottomTeam||"").toUpperCase();
    var e={topTeam:t1||"TBD",bottomTeam:t2||"TBD",topWins:s.topWins||0,bottomWins:s.bottomWins||0,round:round};
    var teams=[t1,t2].filter(function(t){return t&&t!=="TBD";});
    if(round===2){
      for(var i=0;i<teams.length;i++){
        if(westUpper.has(teams[i])){r2[0]=e;break;}
        if(westLower.has(teams[i])){r2[1]=e;break;}
        if(eastUpper.has(teams[i])){r2[2]=e;break;}
        if(eastLower.has(teams[i])){r2[3]=e;break;}
      }
    }else if(round===3){
      // Normalize: put the known (non-TBD) team in topTeam so display code works consistently
      var norm=Object.assign({},e);
      if(norm.topTeam==='TBD'&&norm.bottomTeam!=='TBD'){norm.topTeam=norm.bottomTeam;norm.bottomTeam='TBD';var tw=norm.topWins;norm.topWins=norm.bottomWins;norm.bottomWins=tw;}
      for(var j=0;j<teams.length;j++){
        if(allWest.has(teams[j])){r3[0]=norm;break;}
        if(allEast.has(teams[j])){r3[1]=norm;break;}
      }
    }else if(round===4){
      // Normalize: put the known (non-TBD) team in topTeam so display code works consistently
      var norm4=Object.assign({},e);
      if(norm4.topTeam==='TBD'&&norm4.bottomTeam!=='TBD'){norm4.topTeam=norm4.bottomTeam;norm4.bottomTeam='TBD';var tw4=norm4.topWins;norm4.topWins=norm4.bottomWins;norm4.bottomWins=tw4;}
      r4=norm4;
    }
  });
  return{r1w:r1w,r1e:r1e,r2:r2,r3:r3,r4:r4};
}

function buildPieChart(totals, colorList) {
  var grand = totals.reduce(function(s,p){return s+p.total;},0);
  if (grand === 0) return "";
  var cx=40, cy=40, r=33, start=0, gap=0.06;
  var slices = "";
  totals.forEach(function(p) {
    var pct = p.total / grand;
    var angle = pct * 2 * Math.PI;
    var s2 = start+gap/2, a2 = angle-gap;
    if (a2 < 0.01){start+=angle;return;}
    var x1=cx+r*Math.sin(s2), y1=cy-r*Math.cos(s2);
    var x2=cx+r*Math.sin(s2+a2), y2=cy-r*Math.cos(s2+a2);
    var large=a2>Math.PI?1:0;
    var col = colorList[p.ci % colorList.length].color;
    slices += '<path d="M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+',1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z" fill="'+col+'"/>';
    start += angle;
  });
  return '<svg width="44" height="44" viewBox="0 0 80 80" style="flex-shrink:0">'+slices+'</svg>';
}

function buildPlayerSparkline(histData,teams,stroke,liveTotal,W,H){
  if(!histData||histData.length<2)return'';
  var dates=[...new Set(histData.map(function(d){return d.date;}).filter(Boolean))].sort();
  if(dates.length<2)return'';
  var today=new Date().toISOString().substring(0,10);
  var points=dates.map(function(date){
    if(date===today&&liveTotal!=null)return liveTotal;
    return teams.reduce(function(sum,team){
      var e=histData.find(function(d){return d.date===date&&(d.team||'').toUpperCase()===team.toUpperCase();});
      return sum+(e?parseFloat(e.cup)||0:0);
    },0);
  });
  if(!dates.includes(today)&&liveTotal!=null){dates.push(today);points.push(liveTotal);}
  var min=Math.min.apply(null,points),max=Math.max.apply(null,points),range=max-min||1;
  W=W||160; H=H||28; var padX=4,padY=4;
  var xs=points.map(function(_,i){return padX+(i/(points.length-1))*(W-padX*2);});
  var ys=points.map(function(v){return padY+(H-padY*2)*(1-(v-min)/range);});
  var poly=xs.map(function(x,i){return x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ');
  var area='M'+xs[0].toFixed(1)+','+H+' '+xs.map(function(x,i){return'L'+x.toFixed(1)+','+ys[i].toFixed(1);}).join(' ')+' L'+xs[xs.length-1].toFixed(1)+','+H+' Z';
  var trend=points[points.length-1]-points[0];
  var color=stroke||(trend>0.5?'#4ade80':trend<-0.5?'#f87171':'#9ca3af');
  var gradId='psg-'+teams[0]+(W!==160?'-lg':'');
  var dotR=H>30?3:1.5;
  var dots=xs.map(function(x,i){return'<circle cx="'+x.toFixed(1)+'" cy="'+ys[i].toFixed(1)+'" r="'+(i===points.length-1?dotR+1:dotR)+'" fill="'+color+'"/>';}).join('');
  var svgH=H>30?H+'px':'32px';
  return'<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block;height:'+svgH+';margin-top:6px">'
    +'<defs><linearGradient id="'+gradId+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.3"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#'+gradId+')"/>'
    +'<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +dots+'</svg>';
}

function computePlayerStreak(histData,teams,liveTotal){
  if(!histData||histData.length<2)return null;
  var dates=[...new Set(histData.map(function(d){return d.date;}).filter(Boolean))].sort();
  if(dates.length<2)return null;
  var today=new Date().toISOString().substring(0,10);
  var points=dates.map(function(date){
    if(date===today&&liveTotal!=null)return liveTotal;
    return teams.reduce(function(sum,team){
      var e=histData.find(function(d){return d.date===date&&(d.team||'').toUpperCase()===team.toUpperCase();});
      return sum+(e?parseFloat(e.cup)||0:0);
    },0);
  });
  if(!dates.includes(today)&&liveTotal!=null)points.push(liveTotal);
  if(points.length<2)return null;
  var n=points.length-1;
  var lastDiff=points[n]-points[n-1];
  if(Math.abs(lastDiff)<0.05)return null;
  var dir=lastDiff>0?1:-1;
  var count=1;
  for(var i=n-1;i>=1;i--){
    var diff=points[i]-points[i-1];
    if(Math.abs(diff)<0.05)break;
    if((diff>0?1:-1)===dir)count++;
    else break;
  }
  return count>=2?{dir:dir>0?'up':'down',days:count}:null;
}

function buildStreakBadge(histData,teams,liveTotal){
  var streak=computePlayerStreak(histData,teams,liveTotal);
  if(!streak)return'';
  var isUp=streak.dir==='up';
  var arrow=isUp?'▲':'▼';
  var fire=isUp&&streak.days>=3?' 🔥':'';
  var color=isUp?'#4ade80':'#f87171';
  var bg=isUp?'rgba(74,222,128,0.12)':'rgba(248,113,113,0.12)';
  return'<div class="streak-badge" style="color:'+color+';background:'+bg+';border-color:'+color+'33">'+arrow+streak.days+' DAYS'+fire+'</div>';
}

function buildDetailChart(histData, series, gradId) {
  if (!histData || histData.length < 2 || !series || !series.length) return '';
  var today = new Date().toISOString().substring(0,10);
  var dates = [...new Set(histData.map(function(d){return d.date;}).filter(Boolean))].sort();
  if (!dates.includes(today)) dates.push(today);
  if (dates.length < 2) return '';

  var allSeries = series.map(function(s) {
    var pts = dates.map(function(date) {
      if (date === today && s.liveTotal != null) return s.liveTotal;
      return s.teams.reduce(function(sum, team) {
        var e = histData.find(function(d){return d.date===date&&(d.team||'').toUpperCase()===team.toUpperCase();});
        return sum+(e?parseFloat(e.cup)||0:0);
      }, 0);
    });
    return {teams:s.teams, color:s.color, liveTotal:s.liveTotal, isPrimary:s.isPrimary, points:pts};
  });

  var allPts = allSeries.reduce(function(acc,s){return acc.concat(s.points);}, []);
  var dataMin=Math.min.apply(null,allPts), dataMax=Math.max.apply(null,allPts);
  var pad=Math.max(2,(dataMax-dataMin)*0.25);
  var yMin=Math.max(0,dataMin-pad), yMax=Math.min(100,dataMax+pad);
  if(yMax===yMin){yMin=Math.max(0,yMin-5);yMax=Math.min(100,yMax+5);}

  var W=340,H=190,padL=30,padR=10,padT=20,padB=38;
  var cW=W-padL-padR, cH=H-padT-padB;
  var n=dates.length;
  function gx(i){return padL+(n>1?(i/(n-1))*cW:cW/2);}
  function gy(v){return padT+cH*(1-(v-yMin)/(yMax-yMin));}

  var rawRange=yMax-yMin;
  var niceSteps=[0.5,1,2,5,10,15,20,25,50];
  var step=niceSteps.find(function(s){return rawRange/s<=5;}) || 25;
  var gridVals=[];
  for(var g=Math.ceil(yMin/step)*step; g<=yMax+0.001; g+=step) gridVals.push(Math.round(g*10)/10);
  var grid=gridVals.map(function(v){
    var y=gy(v).toFixed(1);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>'
      +'<text x="'+(padL-4)+'" y="'+(gy(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="8" font-family="Barlow Condensed,sans-serif" fill="#4b5563">'+v+'%</text>';
  }).join('');

  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtD(d){
    if(d===today)return'Now';
    var p=d.split('-');return months[parseInt(p[1])-1]+' '+parseInt(p[2]);
  }
  var _dlStep=Math.max(1,Math.ceil((n-1)/6));
  var dateEls=dates.map(function(d,i){
    if(i!==0&&i!==n-1&&i%_dlStep!==0)return'';
    var x=gx(i),baseY=padT+cH+5;
    return '<text transform="rotate(-40,'+x.toFixed(1)+','+baseY+')" x="'+x.toFixed(1)+'" y="'+baseY+'" text-anchor="end" font-size="11" font-family="Barlow Condensed,sans-serif" fill="#6b7280">'+fmtD(d)+'</text>';
  }).join('');

  var solo=series.length===1;
  var nonPrimary=allSeries.filter(function(s){return !s.isPrimary;});
  var primary=allSeries.filter(function(s){return s.isPrimary;});
  var renderOrder=nonPrimary.concat(primary);

  var defs='<defs>';
  var paths='';
  renderOrder.forEach(function(s) {
    var pts=s.points;
    var linePts=pts.map(function(v,i){return gx(i).toFixed(1)+','+gy(v).toFixed(1);}).join(' ');
    if (s.isPrimary) {
      var gid=gradId||'sdg-p';
      defs+='<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
        +'<stop offset="0%" stop-color="'+s.color+'" stop-opacity="0.2"/>'
        +'<stop offset="100%" stop-color="'+s.color+'" stop-opacity="0"/>'
        +'</linearGradient>';
      var areaD='M'+gx(0).toFixed(1)+','+(padT+cH)+' '
        +pts.map(function(v,i){return'L'+gx(i).toFixed(1)+','+gy(v).toFixed(1);}).join(' ')
        +' L'+gx(n-1).toFixed(1)+','+(padT+cH)+' Z';
      paths+='<path d="'+areaD+'" fill="url(#'+gid+')"/>';
    }
    paths+='<polyline points="'+linePts+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.isPrimary?2:1.5)+'" stroke-linecap="round" stroke-linejoin="round" opacity="'+(s.isPrimary?1:0.7)+'"/>';
    pts.forEach(function(v,i) {
      var x=gx(i),y=gy(v),isLast=i===n-1;
      paths+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(isLast?4:s.isPrimary?3:2.5)+'" fill="'+s.color+'" opacity="'+(s.isPrimary?1:0.75)+'"/>';
      if (solo) {
        var lY=(i%2===0)?(y-7):(y+13);
        if(y-7<padT)lY=y+13;
        if(lY>padT+cH-2)lY=y-7;
        paths+='<text x="'+x.toFixed(1)+'" y="'+lY.toFixed(1)+'" text-anchor="middle" font-size="8.5" font-family="Barlow Condensed,sans-serif" fill="'+s.color+'" font-weight="'+(isLast?'700':'400')+'">'+v.toFixed(1)+'%</text>';
      } else if (isLast) {
        var lY2=y-8; if(lY2<padT)lY2=y+12;
        paths+='<text x="'+x.toFixed(1)+'" y="'+lY2.toFixed(1)+'" text-anchor="middle" font-size="8.5" font-family="Barlow Condensed,sans-serif" fill="'+s.color+'" font-weight="700">'+v.toFixed(1)+'%</text>';
      }
    });
  });
  defs+='</defs>';

  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">'
    +defs+grid+paths+dateEls+'</svg>';
}

      var e = hist.find(function(d){return d.date===date&&(d.team||'').toUpperCase()===team.toUpperCase();});
      return e ? parseFloat(e.cup)||0 : 0;
    });
    var total = teamVals.reduce(function(a,b){return a+b;},0);
    return {date:date, isLive:isLive, teamVals:teamVals, total:total};
  });

  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      +'<td style="padding:9px 4px 9px 0;text-align:right;font-size:11px;color:'+deltaColor+'">'+deltaStr+'</td>'

  var headerCells = teams.map(function(t) {

  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:#0d1117;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;box-sizing:border-box;';
  overlay.innerHTML =
    '<div style="max-width:480px;margin:0 auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;color:#f9fafb">'

function buildSeriesDetailChart(histData, t1, t2, roundKey, lv1, lv2) {
  var getMap = function(team) {
    var map = {};
    (histData||[])
      .filter(function(d){ return (d.team||'').toUpperCase()===team.toUpperCase() && d[roundKey]!=null && d[roundKey]!==''; })
      .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); })
      .forEach(function(d){ map[d.date] = normPct(d[roundKey]); });
    return map;
  };
  var map1=getMap(t1), map2=getMap(t2);
  var today=new Date().toISOString().substring(0,10);
  if (lv1!=null) map1[today]=lv1;
  if (lv2!=null) map2[today]=lv2;
  var allDates=[...new Set([...Object.keys(map1),...Object.keys(map2)])].sort();
  if (allDates.length<2) return '';
  var THRESH=1.0, kept=[allDates[0]], fp1=map1[allDates[0]]!=null?map1[allDates[0]]:null, fp2=map2[allDates[0]]!=null?map2[allDates[0]]:null;
  for (var ki=1; ki<allDates.length-1; ki++) {
    var kd=allDates[ki], kv1=map1[kd]!=null?map1[kd]:fp1, kv2=map2[kd]!=null?map2[kd]:fp2;
    var kchg=Math.max(fp1!=null?Math.abs(kv1-fp1):0, fp2!=null?Math.abs(kv2-fp2):0);
    if (kchg>=THRESH){kept.push(kd);if(map1[kd]!=null)fp1=map1[kd];if(map2[kd]!=null)fp2=map2[kd];}
  }
  if (allDates.length>1) kept.push(allDates[allDates.length-1]);
  allDates=[...new Set(kept)];
  var v1arr=[], v2arr=[], last1=null, last2=null;
  allDates.forEach(function(d){
    if (map1[d]!=null) last1=map1[d];
    if (map2[d]!=null) last2=map2[d];
    v1arr.push(last1); v2arr.push(last2);
  });
  var allVals=[...v1arr,...v2arr].filter(function(v){return v!=null;});
  if (!allVals.length) return '';
  var dataMin=Math.min.apply(null,allVals), dataMax=Math.max.apply(null,allVals);
  var pad=Math.max(3,(dataMax-dataMin)*0.25);
  var yMin=Math.max(0,dataMin-pad), yMax=Math.min(100,dataMax+pad);
  if (yMax===yMin){yMin=Math.max(0,yMin-10);yMax=Math.min(100,yMax+10);}
  var W=340,H=185,padL=32,padR=12,padT=18,padB=40;
  var cW=W-padL-padR, cH=H-padT-padB;
  var n=allDates.length;
  function gx(i){return padL+(n>1?(i/(n-1))*cW:cW/2);}
  function gy(v){return padT+cH*(1-(v-yMin)/(yMax-yMin));}
  var rawRange=yMax-yMin;
  var niceSteps=[1,2,5,10,15,20,25,50];
  var step=niceSteps.find(function(s){return rawRange/s<=5;})||25;
  var gridVals=[];
  for (var g=Math.ceil(yMin/step)*step; g<=yMax+0.001; g+=step) gridVals.push(Math.round(g*10)/10);
  var grid=gridVals.map(function(v){
    var y=gy(v).toFixed(1);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>'
      +'<text x="'+(padL-4)+'" y="'+(gy(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="8" font-family="Barlow Condensed,sans-serif" fill="#4b5563">'+v+'%</text>';
  }).join('');
  var ref50=(yMin<=50&&yMax>=50)
    ?'<line x1="'+padL+'" y1="'+gy(50).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy(50).toFixed(1)+'" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,3"/>'
    :'';
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtD(d){ if(d===today)return'Now'; var p=d.split('-');return months[parseInt(p[1])-1]+' '+parseInt(p[2]); }
  var _dsStep=Math.max(1,Math.ceil((n-1)/6));
  var dateEls=allDates.map(function(d,i){
    if(i!==0&&i!==n-1&&i%_dsStep!==0)return'';
    var x=gx(i), baseY=padT+cH+8;
    return '<text transform="rotate(-40,'+x.toFixed(1)+','+baseY+')" x="'+x.toFixed(1)+'" y="'+baseY+'" text-anchor="end" font-size="9" font-family="Barlow Condensed,sans-serif" fill="#6b7280">'+fmtD(d)+'</text>';
  }).join('');
  var col1='#60a5fa', col2='#fb923c';
  function buildLine(varr, col) {
    var pts=[];
    varr.forEach(function(v,i){if(v!=null)pts.push({x:gx(i),y:gy(v)});});
    if (pts.length<2) return '';
    var poly=pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
    var dots=pts.map(function(p,j){
      return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(j===pts.length-1?3:2)+'" fill="'+col+'"/>';
    }).join('');
    return '<polyline points="'+poly+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots;
  }
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block">'
    +grid+ref50+buildLine(v1arr,col1)+buildLine(v2arr,col2)+dateEls+'</svg>';
}

// Compact game list for bracket card expand: finished + live games only, no date
function buildBracketGames(t1, t2, gamesData) {
  if (!gamesData || !gamesData.length) return '';
  var games = gamesData.filter(function(g) {
    return [g.away,g.home].indexOf(t1)>=0 && [g.away,g.home].indexOf(t2)>=0;
  }).sort(function(a,b){ return new Date(a.startUTC)-new Date(b.startUTC); });
  var rows = games.map(function(g, i) {
    var as = g.awayScore||0, hs = g.homeScore||0;
    var gn = '<span class="bc-gn">G' + (i+1) + '</span>';
    if (g.state==='OFF'||g.state==='FINAL') {
      var awayWin = as > hs, homeWin = hs > as;
      var awayStr = (awayWin ? '<span class="bc-win">' : '') + g.away + ' ' + as + (awayWin ? '</span>' : '');
      var homeStr = (homeWin ? '<span class="bc-win">' : '') + hs + ' ' + g.home + (homeWin ? '</span>' : '');
      return '<div class="bc-gr">' + gn + '<span>' + awayStr + ' · ' + homeStr + '</span></div>';
    } else if (g.state==='LIVE'||g.state==='CRIT') {
      return '<div class="bc-gr bc-gr-live">' + gn + '<span style="color:#f87171;font-size:9px;margin-right:2px">LIVE</span><span>' + g.away + ' ' + as + ' · ' + hs + ' ' + g.home + (g.period?' P'+g.period:'') + '</span></div>';
    } else {
      return null; // skip future games
    }
  }).filter(Boolean).join('');
  return rows;
}

// Detect which round is currently active (highest round with real teams)
function getActiveRound(parsed) {
  if (!parsed) return 1;
  var r2 = parsed.r2 || [], r3 = parsed.r3 || [], r4 = parsed.r4;
  // R2 becomes active only when all 4 slots have real teams
  var r2AllTeams = r2.every(function(s){return s&&s.topTeam&&s.topTeam!=='TBD';});
  if (!r2AllTeams) return 1;
  // Stay at R2 until every R2 series is finished
  var r2AllDone = r2.every(function(s){return s&&(s.topWins===4||s.bottomWins===4);});
  if (!r2AllDone) return 2;
  // Advance to R3 when any CF team is known
  var r3HasTeams = r3.some(function(s){return s&&((s.topTeam&&s.topTeam!=='TBD')||(s.bottomTeam&&s.bottomTeam!=='TBD'));});
  if (!r3HasTeams) return 2;
  var r3AllDone = r3.filter(Boolean).every(function(s){return s.topWins===4||s.bottomWins===4;});
  if (!r3AllDone) return 3;
  var r4HasAnyTeam = r4&&((r4.topTeam&&r4.topTeam!=='TBD')||(r4.bottomTeam&&r4.bottomTeam!=='TBD'));
  return r4HasAnyTeam ? 4 : 3;
}

async function _injectPhysicalsM(away, home) {

      var res = await fetch(ODDS_API+'?action=teamPhysicals&away='+away+'&home='+home+'&t='+Date.now(),{cache:'no-store'});

function showLiveGameOverlayMaker(gameId,away,home,season){
  var existing=document.getElementById('live-game-overlay');
  if(existing)existing.remove();
  var overlay=document.createElement('div');
  overlay.id='live-game-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:#0d1117;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 32px;box-sizing:border-box;';
  overlay.innerHTML='<div style="max-width:480px;margin:0 auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:700;color:#9ca3af">'+away+' vs '+home+'</div>'
    +'<button onclick="document.getElementById(\'live-game-overlay\').remove()" style="background:rgba(255,255,255,0.08);border:none;color:#9ca3af;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:Inter,sans-serif;font-size:14px">✕</button>'
    +'</div>'
    +'<div style="color:#6b7280;font-size:13px;text-align:center;padding:60px 0">Loading…</div>'
    +'</div>';
  document.body.appendChild(overlay);
  var url=ODDS_API+'?action=mpGame&id='+gameId+'&season='+(season||'20252026');
  var gameOver=false;
  function load(){
    fetch(url,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      var el=document.getElementById('live-game-overlay');
      if(!el)return;
      if(data.error){el.innerHTML='<div style="padding:40px;text-align:center;color:#f87171">'+data.error+'</div>';return;}
      gameOver=!!data.gameOver;
      renderLiveGameOverlayMaker(el,data,away,home);
    }).catch(function(){
      var el=document.getElementById('live-game-overlay');
      if(el)el.innerHTML='<div style="padding:40px;text-align:center;color:#f87171">Failed to load</div>';
    });
  }
  load();
  var timer=setInterval(function(){
    if(!document.getElementById('live-game-overlay')||gameOver){clearInterval(timer);return;}
    load();
  },30000);
}
